        margin-bottom: 16px;
        box-shadow:
          0 16px 34px rgba(18, 39, 108, 0.25),
          inset 0 1px 0 rgba(255, 255, 255, 0.35),
          inset 0 -10px 24px rgba(13, 38, 103, 0.3);
        transform: translateZ(0);
      }
      .head::before {
        content: "";
        position: absolute;
        left: 14px;
        right: 14px;
        top: 8px;
        height: 42%;
        border-radius: 12px;
        background: linear-gradient(to bottom, rgba(255,255,255,0.28), rgba(255,255,255,0));
        pointer-events: none;
      }
      .head::after {
        content: "";

        inset: 0;
        border-radius: 16px;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16);
        pointer-events: none;
      }

      .head-univ-link.is-active {

  <body>
    <div class="wrap">
      <div class="head">
        <div class="head-top">
          <h1>✅ 주요 대학 공지사항 모음(실시간)<\\/h1>
          <span class="head-note">(2026.03.14.제작: 김태훈T)<\\/span>
        <\\/div>
        <p class="head-subtitle">- 최근 7일 이내 업로드 NEW<\\/p>
        <div class="head-univ-grid" id="headUnivGrid"><\\/div>
      <\\/div>

      <div class="controls">
        <input id="keyword" type="text" placeholder="키워드 입력" />
        <select id="univ">
          <option value="ALL">전체 대학<\\/option>
        <\\/select>
        <button onclick="refreshData(true)">새로고침<\\/button>
      <\\/div>

        <div id="count">총 0건<\\/div>

      <\\/div>

      <div class="loading blink" id="loading">🐣 로딩중...<\\/div>
      <div class="list" id="list"><\\/div>
    <\\/div>

    <script>
      function escapeHtml(str) {
        return (str || "")
          .replace(/&/g, "&amp;")
          .replace(/<\\/g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function formatKst(iso) {
        if (!iso) return "-";
        var d = new Date(iso);
        if (isNaN(d.getTime())) return iso;
        return d.toLocaleString("ko-KR", {
          timeZone: "Asia/Seoul",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        });
      }

      var allItems = [];
      var lastUpdatedAt = "";
      var loadWatchTimer = null;

      function isWithinDays(dateIso, days) {
        if (!dateIso) return false;
        var d = new Date(dateIso + "T00:00:00");
        if (isNaN(d.getTime())) return false;
        var now = new Date();
        var diff = now.getTime() - d.getTime();
        var dayMs = 24 * 60 * 60 * 1000;
        return diff >= 0 && diff <= days * dayMs;
      }

      function getUnivMarkHtml(it) {
        var key = String(it.univKey || "").toUpperCase();
        var name = it.univName || key || "-";
        var classMap = {
          SNU: "snu", YSU: "ysu", KU: "ku", SGU: "sgu", SKKU: "skku", HYU: "hyu",
          CAU: "cau", KHU: "khu", HUFS: "hufs", UOS: "uos", KONKUK: "konkuk",
          DGU: "dgu", HONGIK: "hongik", EWHA: "ewha", SMWU: "smwu", KMA: "kma",
          NAVY: "navy", AFA: "afa", AFNA: "afna", KNPU: "knpu",
          SEOULTECH: "other", INHA: "other", AJOU: "other", SSU: "other",
          KOOKMIN: "other", HYERICA: "other", SEJONG: "other", GACHON: "other",
          MJU: "other", SANGMYUNG: "other", CUK: "other", KYONGGI: "other"
        };
        var cls = classMap[key] || "other";
        var iconUrl = (it.univIcon || "").trim();
        var iconHtml = iconUrl
          ? '<img class="univ-pill-fav" src="' + escapeHtml(iconUrl) + '" alt="" width="16" height="16" referrerpolicy="no-referrer" loading="lazy">'
          : '<span class="univ-pill-icon">★<\\/span>';

        return (
          '<span class="univ-mark">' +
            '<span class="univ-pill ' + cls + '">' + iconHtml + escapeHtml(name) + "<\\/span>" +
          "<\\/span>"
        );
      }

      function fillUnivSelect(sources) {
        var sel = document.getElementById("univ");
        var prev = String(sel.value || "ALL").toUpperCase();
        sel.innerHTML = '<option value="ALL">전체 대학<\\/option>';
        (sources || []).forEach(function (s) {
          if (!s || !s.key) return;
          var opt = document.createElement("option");
          opt.value = String(s.key || "").toUpperCase();
          opt.textContent = s.name || s.key;
          sel.appendChild(opt);
        });
        var has = false;
        for (var i = 0; i < sel.options.length; i++) {
          if (sel.options[i].value === prev) { has = true; break; }
        }
        sel.value = has ? prev : "ALL";
      }

      function fillHeadUnivGrid(sources) {
        var grid = document.getElementById("headUnivGrid");
        if (!grid) return;
        grid.innerHTML = "";

        var allBtn = document.createElement("button");
        allBtn.type = "button";
        allBtn.className = "head-univ-link head-univ-all";
        allBtn.setAttribute("data-univ-key", "ALL");
        allBtn.title = "모든 학교 공지 보기";
        allBtn.addEventListener("click", function () {
          var sel = document.getElementById("univ");
          sel.value = "ALL";
          grid.querySelectorAll(".head-univ-link.is-active").forEach(function (x) {
            x.classList.remove("is-active");
          });
          allBtn.classList.add("is-active");
          applyFilterInstant();
        });
        var allIcon = document.createElement("span");
        allIcon.className = "head-univ-icon";
        allIcon.textContent = "전";
        var allName = document.createElement("span");
        allName.className = "head-univ-name";
        allName.textContent = "전체 보기";
        allBtn.appendChild(allIcon);
        allBtn.appendChild(allName);
        grid.appendChild(allBtn);

        (sources || []).forEach(function (s) {
          if (!s || !s.key) return;
          var a = document.createElement("a");
          a.className = "head-univ-link";
          a.href = s.url || "#";
          a.setAttribute("data-univ-key", String(s.key || "").toUpperCase());
          a.title = (s.name || s.key) + " \— 클릭: 이 학교 공지만 보기 · Ctrl+클릭: 입학처 페이지";
          a.addEventListener("click", function (e) {
            if (e.button !== 0) return;
            if (e.ctrlKey || e.metaKey) return;
            e.preventDefault();
            var sel = document.getElementById("univ");
            sel.value = String(s.key || "").toUpperCase();
            grid.querySelectorAll(".head-univ-link.is-active").forEach(function (x) {
              x.classList.remove("is-active");
            });
            a.classList.add("is-active");
            applyFilterInstant();
            if (String(s.key || "").toUpperCase() === "KMA" && !hasKmaInList()) {
              tryMergeKmaViaPublicProxyInBrowser();
            }
          });
          var icon = document.createElement("span");
          icon.className = "head-univ-icon";
          if (s.icon) {
            var img = document.createElement("img");
            img.src = s.icon;
            img.alt = "";
            img.width = 16;
            img.height = 16;
            img.setAttribute("referrerpolicy", "no-referrer");
            img.loading = "lazy";
            icon.appendChild(img);
          } else {
            icon.textContent = "★";
          }
          var name = document.createElement("span");
          name.className = "head-univ-name";
          name.textContent = s.name || s.key;
          a.appendChild(icon);
          a.appendChild(name);
          grid.appendChild(a);
        });
      }

      function bindListRowClicks() {
        var list = document.getElementById("list");
        if (!list) return;
        list.querySelectorAll(".item--row[data-href]").forEach(function (row) {
          var href = row.getAttribute("data-href");
          if (!href) return;
          var go = function () {
            window.open(href, "_blank", "noopener,noreferrer");
          };
          row.addEventListener("click", go);
          row.addEventListener("keydown", function (ev) {
            if (ev.key === "Enter" || ev.key === " ") {
              ev.preventDefault();
              go();
            }
          });
        });
      }

      function loadUnivUi(done) {
        google.script.run
          .withSuccessHandler(function (sources) {
            fillHeadUnivGrid(sources);
            fillUnivSelect(sources);
            if (done) done();
          })
          .withFailureHandler(function () {
            if (done) done();
          })
          .getUnivSources();
      }

      function render(items, updatedAt) {
        var list = document.getElementById("list");
        var count = document.getElementById("count");
        var updated = document.getElementById("updated");

        count.textContent = "총 " + (items.length || 0) + "건";
        updated.textContent = "업데이트: " + formatKst(updatedAt || lastUpdatedAt);

        if (!items || items.length === 0) {
          list.innerHTML = '<div class="empty">조건에 맞는 공지사항이 없습니다.<\\/div>';
          return;
        }

        var html = items
          .map(function (it) {
            var isRecent = isWithinDays(it.dateISO, 7);
            var rawUrl = String(it.url || "").trim();
            var hasUrl = rawUrl.length > 0 && rawUrl !== "#";
            var rowClass = "item item--row" + (isRecent ? " recent" : "") + (hasUrl ? "" : " item--no-link");
            var safeHref = hasUrl ? rawUrl : "";
            var titleText = escapeHtml(it.title || "(제목 없음)");
            return (
              '<div class="' +
              rowClass +
              '" data-href="' +
              escapeHtml(safeHref) +
              '" tabindex="' +
              (hasUrl ? "0" : "-1") +
              '" role="link">' +
              '<div class="date-wrap"><span class="date">' +
              escapeHtml(it.dateText || "-") +
              "<\\/span>" +
              (isRecent ? '<span class="new-chip">NEW<\\/span>' : "") +
              "<\\/div>" +
              "<div>" +
              getUnivMarkHtml(it) +
              "<\\/div>" +
              '<div class="title"><span class="title-link">' +
              titleText +
              "<\\/span><\\/div>" +
              "<\\/div>"
            );
          })
          .join("");

        list.innerHTML = html;
        bindListRowClicks();
      }

      function applyFilterInstant() {
        var keyword = (document.getElementById("keyword").value || "").toLowerCase().trim();
        var univ = (document.getElementById("univ").value || "ALL").toUpperCase();

        var grid = document.getElementById("headUnivGrid");
        if (grid) {
          grid.querySelectorAll(".head-univ-link").forEach(function (el) {
            var k = String(el.getAttribute("data-univ-key") || "").toUpperCase();
            var active = univ === "ALL" ? k === "ALL" : k !== "ALL" && k === univ;
            el.classList.toggle("is-active", active);
          });
        }

        var filtered = allItems.filter(function (it) {
          var itKey = String(it.univKey || "").toUpperCase();
          var okUniv = univ === "ALL" || itKey === univ;
          var okKeyword = !keyword || (it.title || "").toLowerCase().indexOf(keyword) !== -1;
          return okUniv && okKeyword;
        });
        render(filtered, lastUpdatedAt);
      }

      function setLoadHint(mode) {
        var el = document.getElementById("loadHint");
        if (!el) return;
        if (mode === "snapshot") {
          el.style.display = "block";
          el.textContent = "저장된 목록을 불러왔습니다. 최신 통합 수집은 「새로고침」을 눌러 주세요.";
        } else {
          el.style.display = "none";
          el.textContent = "";
        }
      }

      function hasKmaInList() {
        for (var i = 0; i < allItems.length; i++) {
          if (String(allItems[i].univKey || "").toUpperCase() === "KMA") return true;
        }
        return false;
      }

      function mergeKmaExtraItems(extra) {
        if (!extra || !extra.length) return;
        var seen = {};
        allItems.forEach(function (it) {
          seen[String(it.title || "") + "|" + String(it.dateISO || "")] = true;
        });
        extra.forEach(function (it) {
          var k = String(it.title || "") + "|" + String(it.dateISO || "");
          if (seen[k]) return;
          seen[k] = true;
          allItems.push(it);
        });
        allItems.sort(function (a, b) {
          return new Date(b.dateISO || 0).getTime() - new Date(a.dateISO || 0).getTime();
        });
        applyFilterInstant();
      }

       
      function stripTagsKma(s) {
        return (s || "")
          .replace(/<script[\\\\s\\\\S]*?<\\\\/script>/gi, "")
          .replace(/<[^>]+>/g, " ")
          .replace(/\\\\s+/g, " ")
          .trim();
      }

      function clientParseKmaFromHtml(html, pageUrlForOrigin) {
        if (!html || html.indexOf("artclView") === -1) return [];
        var originMatch = pageUrlForOrigin.match(/^(https?:\\\\/\\\\/[^\\\\/]+)/);
        var origin = originMatch ? originMatch[1] : "https://kma.ac.kr";
        var out = [];
        var re = /\\\\/bbs\\\\/kma\\\\/160\\\\/(\\\\d+)\\\\/artclView\\\\.do/gi;
        var seenHref = {};
        var m;
        while ((m = re.exec(html)) !== null) {
          var href = "/bbs/kma/160/" + m[1] + "/artclView.do";
          if (seenHref[href]) continue;
          seenHref[href] = true;
          var idx = m.index;
          var chunk = html.substring(idx, Math.min(html.length, idx + 4800));
          var tm = chunk.match(/<div[^>]*class="artclTitle"[^>]*>[\\\\s\\\\S]*?<strong>([\\\\s\\\\S]*?)<\\\\/strong>/i);
          var title = stripTagsKma(tm ? tm[1] : "");
          var dm = chunk.match(/<dt>[\\\\s\\\\r\\
]*등록일[\\\\s\\\\r\\
]*<\\\\/dt>[\\\\s\\\\S]*?<dd>[\\\\s\\\\r\\
]*(\\\\d{4}[.\\\\-\\\\/]\\\\d{1,2}[.\\\\-\\\\/]\\\\d{1,2})/i);
          if (!title || !dm) continue;
          var dateRaw = stripTagsKma(dm[1]);
          var dateM = dateRaw.match(/(\\\\d{4})\\\\D+(\\\\d{1,2})\\\\D+(\\\\d{1,2})/);
          if (!dateM) continue;
          var y = dateM[1];
          var mo = ("0" + parseInt(dateM[2], 10)).slice(-2);
          var da = ("0" + parseInt(dateM[3], 10)).slice(-2);
          var iso = y + "-" + mo + "-" + da;
          title = title.replace(/육사/g, "육군사관");
          if (title.length < 2) continue;
          out.push({
            title: title,
            url: origin + href,
            dateText: y + "." + parseInt(dateM[2], 10) + "." + parseInt(dateM[3], 10),
            dateISO: iso,
            univKey: "KMA",
            univName: "육군사관",
            univIcon: "https://www.google.com/s2/favicons?domain=kma.ac.kr&sz=64"
          });
          if (out.length >= 12) break;
        }
        return out;
      }

      function tryMergeKmaViaPublicProxyInBrowser() {
        if (hasKmaInList()) return;
        var targets = [
          "https://kma.ac.kr/bbs/kma/160/artclList.do?pageNo=1",
          "https://www.kma.ac.kr/bbs/kma/160/artclList.do?pageNo=1",
          "https://kma.ac.kr:461/bbs/kma/160/artclList.do?pageNo=1",
          "https://www.kma.ac.kr:461/bbs/kma/160/artclList.do?pageNo=1"
        ];
        var idx = 0;
        function fallBackToServer() {
          google.script.run
            .withSuccessHandler(function (extra) {
              mergeKmaExtraItems(extra);
            })
            .withFailureHandler(function () {})
            .getKmaNoticesViaProxyOnly();
        }
        function tryOne() {
          if (hasKmaInList()) return;
          if (idx >= targets.length) {
            fallBackToServer();
            return;
          }
          var u = targets[idx++];
          var proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(u);
          fetch(proxyUrl)
            .then(function (r) {
              return r.text();
            })
            .then(function (html) {
              var parsed = clientParseKmaFromHtml(html, u);
              if (parsed.length) mergeKmaExtraItems(parsed);
              else tryOne();
            })
            .catch(function () {
              tryOne();
            });
        }
        tryOne();
      }

       
      function silentFullNetworkRefreshOnce() {
        if (window.__fullNetworkRefreshDone) return;
        window.__fullNetworkRefreshDone = true;
        google.script.run
          .withSuccessHandler(function (res) {
            var safe = res || {};
            var items = safe.items;
            if (!items || !items.length) return;
            allItems = items;
            lastUpdatedAt = safe.updatedAt || lastUpdatedAt;
            setLoadHint("");
            applyFilterInstant();
            setTimeout(tryMergeKmaViaPublicProxyInBrowser, 200);
          })
          .withFailureHandler(function () {})
          .refreshNotices();
      }

      function refreshData(forceNetwork) {
        var loading = document.getElementById("loading");
        loading.style.display = "block";
        if (loadWatchTimer) {
          clearTimeout(loadWatchTimer);
          loadWatchTimer = null;
        }
        loadWatchTimer = setTimeout(function () {
          loadWatchTimer = null;
          loading.style.display = "none";
          var list = document.getElementById("list");
          var hasRows = list && list.querySelector(".item--row");
          if (!hasRows && (!allItems || allItems.length === 0)) {
            list.innerHTML =
              '<div class="empty">서버 응답이 지연되었습니다. 네트워크·시간 제한일 수 있습니다. 「새로고침」을 다시 눌러 주세요.<\\/div>';
          }
        }, 150000);

        var runner = google.script.run
          .withSuccessHandler(function (res) {
            if (loadWatchTimer) {
              clearTimeout(loadWatchTimer);
              loadWatchTimer = null;
            }
            loading.style.display = "none";
            var safe = res || { updatedAt: "", items: [] };
            allItems = safe.items || [];
            lastUpdatedAt = safe.updatedAt || "";
            setLoadHint(safe.loadMode === "snapshot" ? "snapshot" : "");
            applyFilterInstant();
            setTimeout(tryMergeKmaViaPublicProxyInBrowser, 200);
            if (safe.mergeSuggested) {
              setTimeout(silentFullNetworkRefreshOnce, 2400);
            }
          })
          .withFailureHandler(function (err) {
            if (loadWatchTimer) {
              clearTimeout(loadWatchTimer);
              loadWatchTimer = null;
            }
            loading.style.display = "none";
            setLoadHint("");
            document.getElementById("list").innerHTML =
              '<div class="empty">오류가 발생했습니다: ' + escapeHtml(err && err.message ? err.message : String(err)) + "<\\/div>";
          });

        if (forceNetwork) {
          runner.refreshNotices();
        } else {
          runner.getInitialNotices();
        }
      }

      document.getElementById("keyword").addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          applyFilterInstant();
        }
      });
      document.getElementById("keyword").addEventListener("input", applyFilterInstant);
      document.getElementById("univ").addEventListener("change", function () {
        applyFilterInstant();
        if (String(document.getElementById("univ").value || "").toUpperCase() === "KMA" && !hasKmaInList()) {
          tryMergeKmaViaPublicProxyInBrowser();
        }
      });

      window.addEventListener("load", function () {
        loadUnivUi(function () {
          refreshData(false);
        });
      });
