name: Refresh university notices

on:
  schedule:
    # 매 1시간 (UTC)
    - cron: "10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: univ-notices
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape university notices
        env:
          USE_JINA: "1"
        run: python scripts/build_univ_notices.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add univ-board-data.js data/univ-notices.json univ-sources.json
          if git diff --staged --quiet; then
            echo "No university notice data changes"
            exit 0
          fi
          git commit -m "chore: refresh university notices"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $((i * 4))
          done
          git pull --rebase --autostash origin main
          git push
