name: Refresh university notices

on:
  schedule:
    # 매 3시간 (UTC) — GitHub Pages에 공지·채용 데이터 자동 반영
    - cron: "20 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: univ-notices
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape university notices
        env:
          USE_JINA: "1"
        run: python scripts/build_univ_notices.py

      - name: Scrape recruit listings
        run: python scripts/build_recruit.py

      - name: Scrape JobKorea popular jobs
        run: python scripts/build_jobkorea.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add univ-board-data.js data/univ-notices.json univ-sources.json recruit-board-data.js data/recruit-notices.json jobkorea-board-data.js data/jobkorea-notices.json
          if git diff --staged --quiet; then
            echo "No notice/recruit/jobkorea data changes"
            exit 0
          fi
          git commit -m "chore: refresh university notices, recruit, and JobKorea listings"
          git push
