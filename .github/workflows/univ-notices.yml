name: Refresh university notices

on:
  schedule:
    # 매 1시간 (UTC) — 대학 공지는 수집이 무거워 채용보드보다 간격 유지
    - cron: "10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: univ-notices
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape university notices
        env:
          USE_JINA: "1"
        working-directory: ${{ github.workspace }}
        run: python scripts/build_univ_notices.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add univ-board-data.js data/univ-notices.json univ-sources.json
          if git diff --staged --quiet; then
            echo "No university notice data changes"
            exit 0
          fi
          git commit -m "chore: refresh university notices"
          for i in 1 2 3; do
            git pull --rebase --autostash || true
            if git push; then
              exit 0
            fi
            sleep $((i * 3))
          done
          echo "push retry exhausted (univ)"
          exit 0
