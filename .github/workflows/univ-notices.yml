name: Refresh university notices

on:
  schedule:
    # 매 15분 (UTC) — 전국 입학처 공지
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: univ-board-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape university notices (Node, fast)
        id: scrape_node
        continue-on-error: true
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          USE_JINA: "1"
          UNIV_CONCURRENCY: "24"
        run: node scripts/refresh_univ_notices.mjs

      - name: Fallback scrape (Python)
        if: steps.scrape_node.outcome != 'success'
        continue-on-error: true
        env:
          USE_JINA: "1"
        run: python scripts/build_univ_notices.py

      - name: Validate board JSON
        run: |
          node -e "
          const fs=require('fs');
          for (const f of ['data/univ-notices.json','univ-board-data.js']) {
            let t=fs.readFileSync(f,'utf8');
            if (t.includes('<<<<<<<') || t.includes('>>>>>>>')) {
              console.error('conflict markers in', f);
              process.exit(1);
            }
            if (f.endsWith('.js')) t=t.split('=').slice(1).join('=').trim().replace(/;$/,'');
            const j=JSON.parse(t);
            if (!Array.isArray(j.notices) || !j.notices.length) {
              console.error('empty notices in', f);
              process.exit(1);
            }
            console.log(f, 'notices', j.notices.length, 'minDate', j.minDate);
          }
          "

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add univ-board-data.js data/univ-notices.json univ-sources.json
          if git diff --staged --quiet; then
            echo "No university notice data changes"
            exit 0
          fi
          git commit -m "chore: refresh university notices"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main; then
              if grep -R "<<<<<<<" -n univ-board-data.js data/univ-notices.json >/dev/null 2>&1; then
                echo "Conflict markers detected after rebase; aborting push"
                git rebase --abort || true
                exit 0
              fi
              git push && exit 0
            fi
            sleep $((i * 4))
            git fetch origin main || true
          done
          echo "Push retries exhausted; leaving commit for next run"
          exit 0
