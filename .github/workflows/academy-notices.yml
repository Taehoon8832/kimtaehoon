name: Refresh military academy notices

# 사관학교는 univ-notices(15분)에 포함됨. 수동 긴급 갱신만 유지.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: univ-board-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Scrape academy notices
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        run: node scripts/refresh_academy_univs.mjs

      - name: Validate board JSON
        run: node scripts/validate_board_json.mjs data/univ-notices.json univ-board-data.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add univ-board-data.js data/univ-notices.json univ-sources.json
          if git diff --staged --quiet; then
            echo "No academy notice data changes"
            exit 0
          fi
          git commit -m "chore: refresh military academy notices"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main; then
              if grep -R "<<<<<<<" -n univ-board-data.js data/univ-notices.json >/dev/null 2>&1; then
                echo "Conflict markers after rebase; aborting push"
                git rebase --abort || true
                exit 0
              fi
              git push && exit 0
            fi
            sleep $((i * 4))
            git fetch origin main || true
          done
          echo "Push retries exhausted; leaving commit for next run"
          exit 0
