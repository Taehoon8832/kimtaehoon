name: Refresh community boards

on:
  schedule:
    # 15분마다 (UTC) — 정교사·수만휘·교육정책
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-community-boards
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Scrape teacher cafe
        id: teacher
        continue-on-error: true
        run: python scripts/build_teacher_cafe.py

      - name: Scrape suhui cafe
        id: suhui
        continue-on-error: true
        run: python scripts/build_suhui_cafe.py

      - name: Scrape edu policy
        id: edu
        continue-on-error: true
        run: python scripts/build_edu_policy.py

      - name: Validate community JSON
        id: validate
        run: |
          FILES=(
            data/teacher-notices.json teacher-board-data.js
            data/suhui-notices.json suhui-board-data.js
            data/edu-notices.json edu-board-data.js
          )
          if node scripts/validate_board_json.mjs "${FILES[@]}"; then
            echo "validate=ok" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Validation failed after scrape; restoring last committed board files"
          git checkout -- "${FILES[@]}" || true
          if node scripts/validate_board_json.mjs "${FILES[@]}"; then
            echo "Restored committed board data; skipping broken scrape output"
            echo "validate=restored" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "validate=fail" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Commit community board data
        if: steps.validate.outputs.validate != 'fail'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teacher-board-data.js data/teacher-notices.json \
                  suhui-board-data.js data/suhui-notices.json \
                  edu-board-data.js data/edu-notices.json
          if git diff --staged --quiet; then
            echo "No community board data changes"
            exit 0
          fi
          git commit -m "chore: refresh community boards"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main; then
              if grep -R "^<<<<<<<\|^>>>>>>>\|^=======" -n teacher-board-data.js suhui-board-data.js edu-board-data.js data/teacher-notices.json data/suhui-notices.json data/edu-notices.json >/dev/null 2>&1; then
                echo "Conflict markers after rebase; aborting push"
                git rebase --abort || true
                exit 0
              fi
              git push && exit 0
            fi
            sleep $((i * 4))
            git fetch origin main || true
          done
          echo "Push retries exhausted; leaving commit for next run"
          exit 0
