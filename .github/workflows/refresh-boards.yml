name: Refresh job & recruit boards

on:
  schedule:
    # 15분마다 (UTC)
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-boards
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Scrape JobKorea
        id: jobkorea
        continue-on-error: true
        run: python scripts/build_jobkorea.py

      - name: Scrape recruit
        id: recruit
        continue-on-error: true
        run: python scripts/build_recruit.py

      - name: Node fallback (job+recruit)
        if: steps.jobkorea.outcome != 'success' || steps.recruit.outcome != 'success'
        continue-on-error: true
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        run: node scripts/refresh_boards.mjs

      - name: Validate board JSON
        run: |
          node scripts/validate_board_json.mjs \
            data/jobkorea-notices.json jobkorea-board-data.js \
            data/recruit-notices.json recruit-board-data.js

      - name: Commit board data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobkorea-board-data.js data/jobkorea-notices.json \
                  recruit-board-data.js data/recruit-notices.json
          if git diff --staged --quiet; then
            echo "No board data changes"
            exit 0
          fi
          git commit -m "chore: refresh job & recruit boards"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main; then
              if grep -R "<<<<<<<" -n jobkorea-board-data.js recruit-board-data.js data/jobkorea-notices.json data/recruit-notices.json >/dev/null 2>&1; then
                echo "Conflict markers after rebase; aborting push"
                git rebase --abort || true
                exit 0
              fi
              git push && exit 0
            fi
            sleep $((i * 4))
            git fetch origin main || true
          done
          echo "Push retries exhausted; leaving commit for next run"
          exit 0
