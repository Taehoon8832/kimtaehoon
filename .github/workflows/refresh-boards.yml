name: Refresh job & recruit boards

on:
  schedule:
    # 15분마다 (UTC)
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-boards
  cancel-in-progress: false

jobs:
  jobkorea:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape JobKorea
        run: python scripts/build_jobkorea.py

      - name: Commit JobKorea data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobkorea-board-data.js data/jobkorea-notices.json
          if git diff --staged --quiet; then
            echo "No JobKorea changes"
            exit 0
          fi
          git commit -m "chore: refresh JobKorea listings"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $((i * 3))
          done
          git pull --rebase --autostash origin main
          git push

  recruit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape recruit
        run: python scripts/build_recruit.py

      - name: Commit recruit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recruit-board-data.js data/recruit-notices.json
          if git diff --staged --quiet; then
            echo "No recruit changes"
            exit 0
          fi
          git commit -m "chore: refresh recruit listings"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $((i * 3))
          done
          git pull --rebase --autostash origin main
          git push
