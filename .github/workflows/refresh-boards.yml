name: Refresh JobKorea board (채용 공고)

on:
  schedule:
    # 10분마다 (UTC) — 채용 공고 빠른 갱신
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jobkorea-board-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape JobKorea (Node, fast)
        id: node
        continue-on-error: true
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        run: node scripts/refresh_boards.mjs --only=jobkorea

      - name: Fallback scrape (Python)
        if: steps.node.outcome != 'success'
        continue-on-error: true
        run: python scripts/build_jobkorea.py

      - name: Validate JobKorea JSON
        run: node scripts/validate_board_json.mjs data/jobkorea-notices.json jobkorea-board-data.js

      - name: Commit JobKorea data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobkorea-board-data.js data/jobkorea-notices.json
          if git diff --staged --quiet; then
            echo "No jobkorea data changes"
            exit 0
          fi
          git commit -m "chore: refresh jobkorea board"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main; then
              if grep -R "<<<<<<<" -n jobkorea-board-data.js data/jobkorea-notices.json >/dev/null 2>&1; then
                echo "Conflict markers after rebase; aborting push"
                git rebase --abort || true
                exit 0
              fi
              git push && exit 0
            fi
            sleep $((i * 4))
            git fetch origin main || true
          done
          echo "Push retries exhausted; leaving commit for next run"
          exit 0
