<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="김태훈닷컴 — 대입정보·학급 진학관리·오픈채팅 바로가기와 실시간 대화" />
  <meta name="theme-color" content="#FA2D48" />
  <title>김태훈닷컴</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-primary-50: #FEE8EC;
      --color-primary-100: #FDC1CB;
      --color-primary-300: #FA6883;
      --color-primary-400: #FA4866;
      --color-primary-500: #FA2D48;
      --color-primary-600: #E01539;
      --color-primary-700: #B30D2D;
      --color-secondary-500: #FF5577;

      --color-neutral-0: #FFFFFF;
      --color-neutral-50: #F2F2F7;
      --color-neutral-100: #E5E5EA;
      --color-neutral-200: #D1D1D6;
      --color-neutral-300: #A8A8AD;
      --color-neutral-500: #636366;
      --color-neutral-700: #2C2C2E;
      --color-neutral-800: #1C1C1E;
      --color-neutral-900: #0A0A0A;
      --color-neutral-1000: #000000;

      --bg-base: #FFFFFF;
      --bg-subtle: #F2F2F7;
      --bg-elevated: #FFFFFF;
      --text-primary: #000000;
      --text-secondary: #1C1C1E;
      --text-tertiary: #636366;
      --text-on-primary: #FFFFFF;
      --border-default: #E5E5EA;
      --border-strong: #D1D1D6;
      --border-focus: #FA2D48;

      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --space-2xl: 48px;
      --space-3xl: 72px;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 22px;
      --radius-full: 9999px;

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.08);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.12);
      --shadow-lg: 0 18px 42px rgba(0, 0, 0, 0.16);
      --shadow-art: 0 18px 36px rgba(250, 45, 72, 0.24);

      --duration-fast: 120ms;
      --duration-base: 240ms;
      --duration-slow: 400ms;
      --ease-out: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

      --kakao-yellow: #FEE500;
      --kakao-fg: #191919;
      --kakao-muted: #888888;
      --kakao-chat-bg: #B2C7DA;
      --kakao-surface: #FFFFFF;
      --kakao-border: #F0F0F0;

      --container: 1080px;
      --font: "Noto Sans KR", "Noto Sans", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-base: #000000;
        --bg-subtle: #0A0A0A;
        --bg-elevated: #0A0A0A;
        --text-primary: #F5F5F7;
        --text-secondary: #F5F5F7;
        --text-tertiary: #8E8E93;
        --border-default: #222226;
        --border-strong: #2C2C2E;
        --color-primary-500: #FF3B58;
        --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);
        --shadow-lg: 0 18px 42px rgba(0, 0, 0, 0.55);
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      background: var(--bg-base);
      color: var(--text-primary);
      letter-spacing: 0;
      line-height: 1.6;
      word-break: keep-all;
      overflow-wrap: break-word;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea {
      font: inherit;
      letter-spacing: inherit;
    }

    img,
    svg {
      display: block;
      max-width: 100%;
    }

    .shell {
      min-height: 100vh;
      background:
        radial-gradient(70% 55% at 50% -8%, rgba(250, 45, 72, 0.14), transparent 62%),
        radial-gradient(45% 35% at 92% 18%, rgba(255, 85, 119, 0.08), transparent 55%),
        linear-gradient(180deg, var(--bg-base) 0%, var(--bg-subtle) 100%);
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 40;
      min-height: 64px;
      padding: 8px clamp(12px, 3vw, 24px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      background: color-mix(in srgb, var(--bg-base) 84%, transparent);
      border-bottom: 1px solid var(--border-default);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      justify-self: start;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }

    .nav-brand:hover .brand-name {
      color: var(--red, #FA2D48);
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(145deg, #FF6482 0%, #FA2D48 55%, #D60035 100%);
      box-shadow: 0 5px 15px rgba(250, 45, 72, 0.25);
      animation: markPulse 3.6s var(--ease-out) infinite;
    }

    .brand-mark svg {
      width: 15px;
      height: 15px;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.3;
      white-space: nowrap;
    }

    .nav-links {
      justify-self: center;
      display: flex;
      align-items: stretch;
      gap: clamp(3px, 0.8vw, 8px);
      max-width: min(980px, 78vw);
    }

    .nav-sep {
      width: 1px;
      align-self: stretch;
      margin: 4px 4px;
      flex: 0 0 1px;
      background: linear-gradient(
        180deg,
        transparent 0%,
        var(--border-strong) 18%,
        var(--border-strong) 82%,
        transparent 100%
      );
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 4px;
      min-width: 0;
      flex: 1 1 0;
      padding: 4px 4px 5px;
      border-radius: 12px;
      text-align: center;
      transition:
        transform var(--duration-fast) var(--ease-out),
        background var(--duration-fast) var(--ease-out);
    }

    .nav-item:hover,
    .nav-item:focus-visible {
      background: color-mix(in srgb, var(--color-primary-500) 8%, transparent);
      transform: translateY(-1px);
      outline: none;
    }

    .nav-item:active {
      transform: scale(0.97);
    }

    .nav-item .ic {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--icon-bg);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
      flex: 0 0 auto;
    }

    .nav-item .ic svg {
      width: 15px;
      height: 15px;
    }

    .nav-item.card-a .ic-aura {
      position: relative;
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .nav-item.card-a .ic-aura::before,
    .nav-item.card-a .ic-aura::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 10px;
      background: conic-gradient(
        from 0deg,
        #ff4d6d,
        #ff9f1c,
        #ffd60a,
        #2ec4b6,
        #4cc9f0,
        #7b2cbf,
        #f72585,
        #ff4d6d
      );
      pointer-events: none;
    }

    .nav-item.card-a .ic-aura::before {
      inset: -3px;
      filter: blur(8px);
      opacity: 0.5;
      animation:
        rainbowOrbit 4s linear infinite,
        rainbowBreath 2.8s ease-in-out infinite;
    }

    .nav-item.card-a .ic-aura::after {
      animation: rainbowOrbit 4s linear infinite;
    }

    .nav-item.card-a .ic {
      position: relative;
      z-index: 1;
      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }

    .nav-item.card-a:hover .ic-aura::before {
      opacity: 0.72;
      filter: blur(9px);
    }

    @keyframes rainbowOrbit {
      to { transform: rotate(360deg); }
    }

    @keyframes rainbowBreath {
      0%, 100% { opacity: 0.42; }
      50% { opacity: 0.68; }
    }

    .nav-item.card-c .ic,
    .nav-item.card-d .ic,
    .nav-item.card-e .ic {
      color: #191919;
      box-shadow: 0 4px 10px rgba(200, 170, 0, 0.22);
    }

    .nav-item em {
      font-style: normal;
      font-size: 9px;
      font-weight: 650;
      line-height: 1.25;
      letter-spacing: -0.02em;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: keep-all;
      max-width: 100%;
    }

    .card-a { --icon-bg: linear-gradient(145deg, #FF8D72 0%, #FA2D48 48%, #5F1235 100%); }
    .card-b { --icon-bg: linear-gradient(135deg, #5D68FF 0%, #B846CE 47%, #FF5577 100%); }
    .card-f { --icon-bg: linear-gradient(145deg, #5AC8FA 0%, #007AFF 48%, #003D7A 100%); }
    .card-g { --icon-bg: linear-gradient(145deg, #FFB340 0%, #FF9500 48%, #C2410C 100%); }
    .card-h { --icon-bg: linear-gradient(145deg, #34C759 0%, #30B0C7 48%, #0A6B6B 100%); }
    .card-c { --icon-bg: linear-gradient(145deg, #FFE566 0%, #FEE500 45%, #C9A800 100%); }
    .card-d { --icon-bg: linear-gradient(145deg, #FFE27A 0%, #FFC107 50%, #E09B00 100%); }
    .card-e { --icon-bg: linear-gradient(145deg, #FFF1A0 0%, #FEE500 40%, #D4AF00 100%); }
    .card-i { --icon-bg: linear-gradient(145deg, #A78BFA 0%, #7C3AED 48%, #4C1D95 100%); }

    .nav-item.is-placeholder {
      cursor: default;
      pointer-events: none;
    }

    .nav-item.is-placeholder:hover,
    .nav-item.is-placeholder:focus-visible {
      background: transparent;
      transform: none;
    }

    .nav-item.is-active {
      background: color-mix(in srgb, var(--color-primary-500) 14%, transparent);
    }

    .nav-actions {
      justify-self: end;
      display: flex;
      align-items: center;
    }

    .inquiry-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px 7px 8px;
      border-radius: var(--radius-full);
      background: #191919;
      color: #FEE500;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.3;
      box-shadow: 0 6px 16px rgba(25, 25, 25, 0.16);
      transition: transform var(--duration-fast) var(--ease-out), background var(--duration-fast) var(--ease-out);
    }

    .inquiry-btn:hover,
    .inquiry-btn:focus-visible {
      transform: translateY(-1px) scale(1.02);
      background: #2c2c2e;
      outline: none;
    }

    .inquiry-btn:active {
      transform: scale(0.97);
    }

    .inquiry-btn .ic {
      width: 22px;
      height: 22px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #FEE500;
      color: #191919;
    }

    .inquiry-btn .ic svg {
      width: 14px;
      height: 14px;
    }

    .container {
      width: min(var(--container), 100%);
      margin: 0 auto;
      padding: 0 clamp(16px, 4vw, 24px);
    }

    .upper-layout {
      position: relative;
      background: var(--bg-base);
      isolation: isolate;
    }

    .upper-layout .nav {
      border-bottom: 1px solid var(--border-default);
    }

    .upper-stage {
      width: min(1280px, 100%);
      margin: 0 auto;
      padding: 0 clamp(12px, 3vw, 20px);
      display: grid;
      gap: clamp(12px, 2vw, 20px);
      align-content: start;
    }

    .upper-stage:has(.expand-panel.is-open) {
      padding-top: clamp(16px, 2.5vw, 24px);
      padding-bottom: clamp(16px, 2.5vw, 24px);
    }

    .stage-rule {
      height: 4px;
      width: 100%;
      margin: 0;
      border: 0;
      background: #191919;
      flex-shrink: 0;
    }

    .lower-layout {
      background:
        radial-gradient(70% 55% at 50% -8%, rgba(250, 45, 72, 0.1), transparent 62%),
        linear-gradient(180deg, var(--bg-subtle) 0%, color-mix(in srgb, var(--bg-subtle) 88%, var(--color-primary-50)) 100%);
      padding-bottom: 28px;
    }

    .chat-section {
      padding: clamp(20px, 3vw, 28px) clamp(12px, 3vw, 20px) clamp(48px, 8vw, 88px);
      width: min(1280px, 100%);
      margin: 0 auto;
    }

    .expand-panel {
      display: none;
      width: 100%;
      margin: 0;
      padding: 0;
      animation: riseIn 0.35s var(--ease-out) both;
    }

    .expand-panel.is-open {
      display: block;
    }
    .expand-panel[data-theme="susi"] {
      --expand-accent: #34C759;
      --expand-mark: linear-gradient(145deg, #34C759 0%, #30B0C7 55%, #0A6B6B 100%);
    }

    .expand-panel[data-theme="ipgyeol"] {
      --expand-accent: #007AFF;
      --expand-mark: linear-gradient(145deg, #5AC8FA 0%, #007AFF 55%, #003D7A 100%);
    }

    .expand-shell {
      overflow: hidden;
      border: 4px solid #191919;
      border-radius: 28px;
      background: var(--bg-elevated);
      box-shadow: 0 24px 50px rgba(25, 25, 25, 0.2);
      min-height: min(82vh, 920px);
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .expand-bar {
      min-height: 56px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      background: color-mix(in srgb, var(--bg-elevated) 90%, var(--expand-accent, #34C759));
      border-bottom: 1px solid var(--border-default);
    }

    .expand-mark {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--expand-mark, linear-gradient(145deg, #34C759 0%, #30B0C7 55%, #0A6B6B 100%));
      flex: 0 0 auto;
    }

    .expand-mark svg {
      width: 15px;
      height: 15px;
    }

    .expand-bar strong {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.4;
      word-break: keep-all;
    }

    .expand-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .expand-open,
    .expand-close {
      border: 0;
      border-radius: var(--radius-full);
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.3;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform var(--duration-fast) var(--ease-out), background var(--duration-fast) var(--ease-out);
    }

    .expand-open {
      background: #191919;
      color: #fff;
    }

    .expand-close {
      background: var(--color-neutral-100);
      color: var(--text-primary);
    }

    @media (prefers-color-scheme: dark) {
      .expand-close {
        background: #2C2C2E;
      }
    }

    .expand-open:hover,
    .expand-close:hover {
      transform: translateY(-1px);
    }

    .expand-frame-wrap {
      min-height: 0;
      background: #f2f2f7;
    }

    .expand-frame {
      width: 100%;
      height: min(76vh, 860px);
      border: 0;
      display: block;
      background: #fff;
    }

    .chat-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: clamp(16px, 2.4vw, 24px);
      align-items: stretch;
      padding: clamp(8px, 2vw, 16px) 0;
    }

    .board-panel {
      min-width: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 680px;
      max-height: min(860px, 88vh);
      border: 4px solid #191919;
      border-radius: 34px;
      background: var(--bg-elevated);
      box-shadow: 0 24px 50px rgba(25, 25, 25, 0.22);
      overflow: hidden;
      animation: riseIn 0.65s var(--ease-out) both;
    }

    .board-bar {
      min-height: 42px;
      height: auto;
      padding: 6px 12px 6px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: color-mix(in srgb, var(--bg-elevated) 92%, var(--color-primary-50));
      border-bottom: 1px solid var(--border-default);
    }

    .board-mark {
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(145deg, #FF8D72 0%, #FA2D48 52%, #7A0820 100%);
      box-shadow: 0 4px 10px rgba(250, 45, 72, 0.22);
    }

    .board-mark svg {
      width: 13px;
      height: 13px;
    }

    .board-bar strong {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.35;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    .board-bar .board-title {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
      padding-top: 0;
    }

    .board-open {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      border-radius: var(--radius-full);
      background: var(--color-primary-500);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.01em;
      box-shadow: 0 6px 14px rgba(250, 45, 72, 0.2);
      transition: transform var(--duration-fast) var(--ease-out), background var(--duration-fast) var(--ease-out);
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .board-open:hover,
    .board-open:focus-visible {
      transform: translateY(-1px) scale(1.02);
      background: var(--color-primary-400);
      outline: none;
    }

    .board-open:active {
      transform: scale(0.97);
    }

    .board-open svg {
      width: 12px;
      height: 12px;
    }

    .board-frame-wrap {
      position: relative;
      min-height: 0;
      overflow: hidden;
      background: #c6d6e4;
      -webkit-overflow-scrolling: touch;
    }

    .board-frame {
      width: 112%;
      height: 112%;
      min-width: 112%;
      border: 0;
      display: block;
      background: #c6d6e4;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      transform: scale(0.89);
      transform-origin: top left;
      scrollbar-width: thin;
      scrollbar-color: rgba(25, 25, 25, 0.25) transparent;
    }

    .board-frame::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .board-frame::-webkit-scrollbar-thumb {
      background: rgba(25, 25, 25, 0.22);
      border-radius: 999px;
    }

    .board-frame::-webkit-scrollbar-track {
      background: transparent;
    }

    .board-fallback {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      padding: 28px 20px;
      text-align: center;
      background: color-mix(in srgb, var(--bg-elevated) 92%, transparent);
    }

    .board-fallback.show {
      display: grid;
    }

    .board-fallback-card {
      width: min(360px, 100%);
      padding: 28px 22px;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      background: var(--bg-elevated);
      box-shadow: var(--shadow-md);
    }

    .board-fallback-card .art {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(145deg, #FF8D72 0%, #FA2D48 52%, #7A0820 100%);
      box-shadow: var(--shadow-art);
    }

    .board-fallback-card .art svg {
      width: 30px;
      height: 30px;
    }

    .board-fallback-card h3 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.35;
    }

    .board-fallback-card p {
      margin: 0 0 18px;
      color: var(--text-tertiary);
      font-size: 13px;
      font-weight: 500;
      line-height: 1.6;
    }

    .univ-notice-panel {
      min-width: 0;
      display: grid;
      grid-template-rows: auto auto 1fr;
      min-height: 680px;
      max-height: min(860px, 88vh);
      border: 4px solid #191919;
      border-radius: 34px;
      background:
        radial-gradient(80% 50% at 8% 0%, rgba(255, 214, 228, 0.45), transparent 58%),
        radial-gradient(70% 45% at 96% 6%, rgba(214, 228, 255, 0.42), transparent 55%),
        linear-gradient(180deg, #fff 0%, #fbf8fc 100%);
      box-shadow: 0 24px 50px rgba(25, 25, 25, 0.18);
      overflow: hidden;
      animation: riseIn 0.65s var(--ease-out) 0.06s both;
    }

    .univ-notice-bar {
      min-height: 42px;
      padding: 6px 12px 6px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: color-mix(in srgb, var(--bg-elevated) 88%, #f3e8ff);
      border-bottom: 1px solid var(--border-default);
    }

    .univ-notice-mark {
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(145deg, #e9a0b4 0%, #c45b7a 55%, #9f6bb8 100%);
      box-shadow: 0 4px 10px rgba(196, 91, 122, 0.24);
    }

    .univ-notice-mark svg {
      width: 13px;
      height: 13px;
    }

    .univ-notice-bar strong {
      font-size: 14px;
      font-weight: 750;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      line-height: 1.3;
    }

    .univ-notice-actions {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .univ-notice-live {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border-radius: var(--radius-full);
      background: #1c1c1e;
      color: #ffd0dc;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .univ-notice-live i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #1aad5c;
      box-shadow: 0 0 0 0 rgba(26, 173, 92, 0.5);
      animation: livePulse 1.8s ease-out infinite;
    }

    .univ-notice-live.is-offline {
      color: #d0d0d0;
    }

    .univ-notice-live.is-offline i {
      background: #8e8e93;
      animation: none;
      box-shadow: none;
    }

    .univ-notice-refresh,
    .univ-notice-open {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--border-default);
      background: #fff;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
      padding: 5px 9px;
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
    }

    .univ-notice-refresh:hover,
    .univ-notice-open:hover,
    .univ-notice-refresh:focus-visible,
    .univ-notice-open:focus-visible {
      border-color: rgba(196, 91, 122, 0.35);
      color: #c45b7a;
      outline: none;
    }

    .univ-notice-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      color: #8a8798;
      font-size: 12px;
      font-weight: 500;
      border-bottom: 1px solid rgba(120, 130, 160, 0.1);
      background: rgba(255, 255, 255, 0.55);
    }

    .univ-notice-search-wrap {
      flex: 1;
      min-width: 0;
    }

    .univ-notice-search {
      width: 100%;
      max-width: 220px;
      height: 30px;
      padding: 0 12px;
      border: 1px solid rgba(120, 130, 160, 0.18);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      color: #2a2d3a;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .univ-notice-search::placeholder {
      color: #a09eb0;
      font-weight: 500;
    }

    .univ-notice-search:focus {
      border-color: rgba(196, 91, 122, 0.45);
      box-shadow: 0 0 0 3px rgba(196, 91, 122, 0.12);
    }

    .univ-notice-item-body {
      min-width: 0;
      display: grid;
      gap: 2px;
    }

    .univ-notice-preview {
      color: #7a7788;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .univ-notice-head {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .univ-notice-head .univ-notice-title {
      flex: 1;
      min-width: 0;
    }

    .univ-notice-item.is-day-start {
      border-top: 2px solid #2a2d3a;
      margin-top: 2px;
      padding-top: 7px;
    }

    .univ-notice-item.is-day-start:first-child {
      border-top: none;
      margin-top: 0;
      padding-top: 5px;
    }

    .univ-notice-item.is-priority .univ-notice-univ {
      background: linear-gradient(180deg, #efe6ff 0%, #e4d7fb 100%);
      border-color: #b89de0;
      color: #4b2d7a;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .univ-notice-list {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      padding: 2px 0;
    }

    .univ-notice-empty {
      margin: 36px 14px;
      text-align: center;
      color: #8a8798;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.6;
    }

    .univ-notice-item {
      display: block;
      padding: 5px 10px;
      border-bottom: 1px solid rgba(120, 130, 160, 0.1);
      cursor: pointer;
      transition: background 0.12s ease;
      background: transparent;
    }

    .univ-notice-item:last-child { border-bottom: none; }

    .univ-notice-item:hover,
    .univ-notice-item:focus-visible {
      background: rgba(255, 236, 242, 0.55);
      outline: none;
    }

    .univ-notice-item.is-today {
      position: relative;
      isolation: isolate;
      background:
        linear-gradient(90deg, rgba(255, 236, 210, 0.88) 0%, rgba(255, 245, 230, 0.55) 42%, rgba(255, 255, 255, 0.15) 78%);
      box-shadow: inset 3px 0 0 #e8a23a;
    }

    .univ-notice-item.is-today::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(
        105deg,
        transparent 0%,
        transparent 35%,
        rgba(255, 255, 255, 0.65) 48%,
        transparent 62%,
        transparent 100%
      );
      background-size: 220% 100%;
      animation: univTodayShine 4.2s ease-in-out infinite;
      pointer-events: none;
    }

    .univ-notice-item.is-today .univ-notice-date {
      color: #8a5a28;
      font-weight: 800;
    }

    .univ-notice-item.is-today .univ-notice-title {
      color: #2a241c;
    }

    .univ-notice-item.is-today .univ-notice-univ {
      background: #fff3d6;
      border-color: #f0c878;
      color: #8a5a28;
    }

    .univ-notice-item.is-today:hover,
    .univ-notice-item.is-today:focus-visible {
      background:
        linear-gradient(90deg, rgba(255, 228, 188, 0.95) 0%, rgba(255, 242, 220, 0.7) 45%, rgba(255, 255, 255, 0.25) 80%);
    }

    .univ-notice-univ {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      max-width: 7.2rem;
      padding: 1px 7px;
      border-radius: 999px;
      border: 1px solid #c9b8e0;
      background: linear-gradient(180deg, #f4ecff 0%, #ebe2f8 100%);
      color: #5b3d8a;
      font-size: 11px;
      font-weight: 800;
      line-height: 1.4;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-decoration: none;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.8) inset;
    }

    .univ-notice-date {
      color: #5c5f6e;
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      white-space: nowrap;
      flex: 0 0 auto;
      min-width: 2.6rem;
      text-align: right;
    }

    .univ-notice-new {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      padding: 0 5px;
      border-radius: 999px;
      background: linear-gradient(135deg, #ffc2d1, #e86b88);
      color: #fff;
      font-size: 9px;
      font-weight: 800;
      line-height: 1.4;
      letter-spacing: 0.03em;
    }

    .univ-notice-title {
      min-width: 0;
      color: #1f2230;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .univ-notice-item:hover .univ-notice-title {
      color: #c45b7a;
    }

    .footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 35;
      padding: 0;
      margin: 0;
      color: rgba(58, 58, 60, 0.72);
      background: linear-gradient(105deg, rgba(255, 245, 247, 0.72) 0%, rgba(255, 232, 240, 0.55) 40%, rgba(238, 246, 255, 0.5) 100%);
      border-top: 1px solid rgba(250, 45, 72, 0.08);
      box-shadow: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .footer-inner {
      position: relative;
      width: 100%;
      margin: 0;
      min-height: 0;
      padding: 2px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .visit-stats {
      display: flex;
      align-items: center;
      gap: 0;
      min-width: 0;
      margin-right: auto;
    }

    .visit-metric {
      display: inline-flex;
      align-items: baseline;
      gap: 5px;
      padding: 0 7px;
      min-width: 0;
      line-height: 1;
    }

    .visit-metric:first-child {
      padding-left: 0;
    }

    .visit-metric:last-child {
      padding-right: 0;
    }

    .visit-total-wrap {
      display: inline-flex;
      align-items: baseline;
      gap: 4px;
    }

    .visit-stats-btn {
      width: 16px;
      height: 16px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 4px;
      display: inline-grid;
      place-items: center;
      background: transparent;
      color: rgba(58, 58, 60, 0.28);
      cursor: pointer;
      transition: color 0.15s ease, background 0.15s ease;
      flex: 0 0 auto;
    }

    .visit-stats-btn:hover,
    .visit-stats-btn:focus-visible {
      color: rgba(196, 91, 122, 0.75);
      background: rgba(196, 91, 122, 0.08);
      outline: none;
    }

    .visit-stats-btn svg {
      width: 11px;
      height: 11px;
      display: block;
    }

    .visit-stats-modal {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 16px;
      background: rgba(20, 18, 28, 0.28);
      backdrop-filter: blur(4px);
    }

    .visit-stats-modal.is-open {
      display: flex;
    }

    .visit-stats-card {
      width: min(420px, 100%);
      margin-bottom: 28px;
      padding: 14px 14px 12px;
      border-radius: 16px;
      border: 1px solid rgba(120, 130, 160, 0.16);
      background:
        radial-gradient(80% 60% at 10% 0%, rgba(255, 214, 228, 0.45), transparent 55%),
        radial-gradient(70% 50% at 100% 0%, rgba(214, 228, 255, 0.4), transparent 50%),
        #fff;
      box-shadow: 0 18px 40px rgba(25, 25, 25, 0.18);
    }

    .visit-stats-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .visit-stats-card-head strong {
      font-size: 14px;
      font-weight: 750;
      letter-spacing: -0.02em;
      color: #2a2d3a;
    }

    .visit-stats-close {
      border: 0;
      background: rgba(120, 130, 160, 0.1);
      color: #5c5f6e;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
    }

    .visit-stats-summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .visit-stats-pill {
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(243, 238, 248, 0.9);
      border: 1px solid rgba(201, 184, 224, 0.45);
    }

    .visit-stats-pill span {
      display: block;
      font-size: 10px;
      font-weight: 650;
      color: #8a8798;
      margin-bottom: 3px;
    }

    .visit-stats-pill b {
      font-family: "Space Grotesk", var(--font);
      font-size: 18px;
      font-weight: 700;
      color: #1c1c1e;
      letter-spacing: -0.03em;
    }

    .visit-stats-chart {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      align-items: end;
      height: 96px;
      padding: 8px 2px 0;
    }

    .visit-stats-bar-wrap {
      display: grid;
      gap: 4px;
      justify-items: center;
      height: 100%;
      align-content: end;
    }

    .visit-stats-bar {
      width: 100%;
      max-width: 28px;
      border-radius: 6px 6px 3px 3px;
      background: linear-gradient(180deg, #f2a0b6 0%, #c45b7a 100%);
      min-height: 4px;
      transition: height 0.35s ease;
    }

    .visit-stats-bar.is-today {
      background: linear-gradient(180deg, #ffd08a 0%, #e8a23a 100%);
    }

    .visit-stats-bar-label {
      font-size: 9px;
      font-weight: 650;
      color: #8a8798;
      white-space: nowrap;
    }

    .visit-stats-bar-val {
      font-size: 9px;
      font-weight: 700;
      color: #5c5f6e;
      font-variant-numeric: tabular-nums;
    }

    .visit-kicker {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 9px;
      font-weight: 650;
      letter-spacing: 0.04em;
      line-height: 1;
      color: rgba(58, 58, 60, 0.38);
      white-space: nowrap;
    }

    .visit-live {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(250, 45, 72, 0.75);
      box-shadow: none;
      animation: none;
      flex: 0 0 auto;
    }

    .visit-label-short {
      display: none;
    }

    .visit-value {
      margin: 0;
      font-family: "Space Grotesk", var(--font);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: rgba(28, 28, 30, 0.78);
      min-width: 1ch;
    }

    .visit-value.is-loading {
      color: rgba(58, 58, 60, 0.22);
      font-weight: 600;
    }

    .visit-rule {
      width: 1px;
      height: 10px;
      margin: 0;
      background: rgba(250, 45, 72, 0.12);
      flex: 0 0 auto;
    }

    .footer-brand {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      margin-left: auto;
    }

    .footer-mark {
      width: 11px;
      height: 11px;
      border-radius: 3px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(145deg, #FF8AA0 0%, #FA2D48 55%, #E85A8C 100%);
      box-shadow: none;
      flex: 0 0 auto;
      opacity: 0.85;
    }

    .footer-mark svg {
      width: 7px;
      height: 7px;
    }

    .footer-copy {
      margin: 0;
      color: rgba(58, 58, 60, 0.4);
      font-size: 10px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: -0.01em;
      white-space: nowrap;
      text-align: right;
    }

    .footer-copy strong {
      color: rgba(44, 44, 46, 0.72);
      font-weight: 700;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 36px;
      z-index: 80;
      transform: translateX(-50%) translateY(20px);
      padding: 12px 16px;
      border-radius: var(--radius-full);
      background: rgba(25, 25, 25, 0.92);
      color: #fff;
      font-size: 13px;
      font-weight: 650;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--duration-base) var(--ease-out), transform var(--duration-base) var(--ease-out);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes markPulse {
      0%, 100% { box-shadow: 0 5px 15px rgba(250, 45, 72, 0.25); }
      50% { box-shadow: 0 8px 22px rgba(250, 45, 72, 0.4); }
    }

    @keyframes livePulse {
      0% { box-shadow: 0 0 0 0 rgba(26, 173, 92, 0.5); }
      70% { box-shadow: 0 0 0 8px rgba(26, 173, 92, 0); }
      100% { box-shadow: 0 0 0 0 rgba(26, 173, 92, 0); }
    }

    @keyframes univTodayShine {
      0% { background-position: 120% 0; opacity: 0.35; }
      40% { opacity: 0.85; }
      100% { background-position: -40% 0; opacity: 0.35; }
    }

    @media (max-width: 980px) {
      .nav {
        grid-template-columns: auto 1fr auto;
      }

      .nav-links {
        max-width: none;
        width: 100%;
      }

      .brand-name {
        display: none;
      }

      .chat-shell {
        grid-template-columns: 1fr;
      }

      .board-panel,
      .univ-notice-panel {
        min-height: 600px;
        max-height: min(780px, 82vh);
        border-radius: 30px;
      }

      .board-bar {
        padding: 6px 12px;
      }

      .board-bar strong {
        font-size: 13px;
        line-height: 1.35;
      }
    }

    @media (max-width: 720px) {
      .nav {
        grid-template-columns: 1fr auto;
        grid-template-areas:
          "brand actions"
          "links links";
        gap: 10px 8px;
        padding: 8px 12px 10px;
        align-items: center;
      }

      .nav-brand {
        grid-area: brand;
        justify-self: start;
        order: unset;
      }

      .brand-name {
        display: block;
      }

      .nav-actions {
        grid-area: actions;
        justify-self: end;
        order: unset;
      }

      .nav-links {
        grid-area: links;
        order: unset;
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px 4px;
        max-width: 100%;
        width: 100%;
        padding: 4px 0 2px;
      }

      .nav-sep {
        display: none;
      }

      .nav-item {
        width: 100%;
        max-width: none;
        flex: none;
        padding: 4px 2px 2px;
        gap: 5px;
      }

      .nav-item em {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        font-size: 8.5px;
        line-height: 1.2;
        font-weight: 700;
        color: var(--text-primary);
        min-height: 2.4em;
      }

      .nav-item .ic {
        width: 28px;
        height: 28px;
        border-radius: 8px;
      }

      .nav-item .ic svg {
        width: 15px;
        height: 15px;
      }

      .nav-item.card-a .ic-aura {
        width: 32px;
        height: 32px;
      }

      .nav-item.card-a .ic-aura::before {
        inset: -2px;
        filter: blur(4px);
        opacity: 0.38;
      }

      .chat-shell {
        gap: 18px;
      }

      .board-panel {
        border-width: 3px;
        border-radius: 24px;
        min-height: min(640px, 78vh);
        max-height: min(780px, 82vh);
      }

      .board-bar {
        padding: 5px 10px;
        gap: 6px;
        min-height: 40px;
      }

      .board-bar strong {
        font-size: 12px;
        line-height: 1.35;
      }

      .board-open {
        padding: 5px 9px;
        font-size: 10px;
      }

      .univ-notice-panel {
        border-width: 3px;
        border-radius: 28px;
        min-height: min(640px, 78vh);
        width: 100%;
      }

      .univ-notice-item {
        padding: 4px 8px;
      }

      .univ-notice-title {
        font-size: 11px;
      }

      .univ-notice-preview {
        font-size: 9px;
      }
    }

    @media (max-width: 420px) {
      .nav-links {
        gap: 8px 2px;
      }

      .nav-item {
        padding: 3px 1px;
      }

      .nav-item em {
        font-size: 8px;
        min-height: 2.4em;
      }

      .nav-item .ic {
        width: 26px;
        height: 26px;
        border-radius: 8px;
      }

      .nav-item .ic svg {
        width: 14px;
        height: 14px;
      }

      .nav-item.card-a .ic-aura {
        width: 30px;
        height: 30px;
      }

      .board-panel {
        border-radius: 20px;
        min-height: min(580px, 74vh);
      }

      .board-bar strong {
        font-size: 12px;
        line-height: 1.4;
      }

      .board-open {
        padding: 5px 8px;
      }

        "한국외대", "서울시립대", "건국대", "동국대", "홍익대", "이화여대", "숙명여대",
        "숭실대", "국민대", "서울과기대", "세종대", "인하대", "아주대", "가천대",
      ];

      function showToast(text) {
        if (!toast) return;
        toast.textContent = text;
        toast.classList.add("show");
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => toast.classList.remove("show"), 2200);
      }

      function escapeHtml(str) {
        return String(str)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function setUnivLive(online, label) {
        if (!univLive || !univLiveLabel) return;
        univLive.classList.toggle("is-offline", !online);
        univLiveLabel.textContent = label;
      }

      function seoulTodayISO() {
        const parts = new Intl.DateTimeFormat("en-CA", {
          timeZone: "Asia/Seoul",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
        }).formatToParts(new Date());
        const get = (t) => parts.find((p) => p.type === t)?.value || "00";
        return `${get("year")}-${get("month")}-${get("day")}`;
      }

      function isJunkText(s) {
        return /var\s|function\s|document\.|<\w+|[{};]=|bbsrg|javascript:/i.test(String(s || ""));
      }

      function priorityRank(name) {
        const n = String(name || "");
        for (let i = 0; i < PRIORITY_ORDER.length; i++) {
          const k = PRIORITY_ORDER[i];
          if (k === "서울과기대" && n.includes("서울과학기술대")) return i;
          if (k === "서울시립대" && (n.includes("서울시립대") || n === "시립대")) return i;
          if (n.includes(k)) return i;
        }
        return 1000;
      }

      function isPriorityUniv(nameOrId) {
        if (univPriority.some((p) => p.univId === nameOrId || p.univName === nameOrId)) return true;
        return priorityRank(nameOrId) < 1000;
      }

      function priorityCfgById(univId) {
        return univPriority.find((p) => p.univId === univId) || null;
      }

      /** 검증된 입학처/공지 URL만 사용 (404 경로 차단) */
      function safeOpenUrl(it) {
        const cfg = priorityCfgById(it.univId);
        const home = String((cfg && cfg.homeUrl) || it.homeUrl || "").trim();
        const board = String((cfg && cfg.boardUrl) || it.boardUrl || "").trim();
        const url = String(it.url || "").trim();
        const broken = /\/admission\/html\/notice\/notice\.asp$/i;
        const badHostPath = /error404|404\.html/i;
        const candidates = [url, board, home].filter((u) => /^https?:\/\//i.test(u));
        for (const u of candidates) {
          if (broken.test(u) || badHostPath.test(u)) continue;
          return u;
        }
        return home || board || "";
      }

      function extractDateISO(text) {
        const m = String(text || "").match(/(20\d{2})\s*[.\-/년]\s*(\d{1,2})\s*[.\-/월]\s*(\d{1,2})/);
        if (!m) return "";
        const iso = `${m[1]}-${String(m[2]).padStart(2, "0")}-${String(m[3]).padStart(2, "0")}`;
        if (iso < "2020-01-01" || iso > "2035-12-31") return "";
        return iso;
      }

      function stripTags(html) {
        return String(html || "")
          .replace(/<script[\s\S]*?<\/script>/gi, " ")
          .replace(/<style[\s\S]*?<\/style>/gi, " ")
          .replace(/<[^>]+>/g, " ")
          .replace(/&nbsp;/gi, " ")
          .replace(/&amp;/gi, "&")
          .replace(/\s+/g, " ")
          .trim();
      }

      function toAbsUrl(href, base) {
        try {
          return new URL(href, base).href.split("#")[0];
        } catch {
          return "";
        }
      }

      function normalizeNotice(it) {
        const title = String(it.title || "").replace(/\s+/g, " ").trim();
        let preview = String(it.preview || "").replace(/\s+/g, " ").trim();
        const univName = String(it.univName || "").replace(/\s+/g, " ").trim();
        const univId = String(it.univId || "");
        const dateISO = String(it.dateISO || "").slice(0, 10);
        const boardOnly = Boolean(it.boardOnly);
        if (!title || !univName) return null;
        if (!boardOnly) {
          if (title.length < 6 || isJunkText(title)) return null;
          if ((title.match(/[가-힣]/g) || []).length < 3) return null;
          if (!dateISO || dateISO < UNIV_MIN_DATE) return null;
        }
        if (isJunkText(preview) || (preview.match(/[가-힣]/g) || []).length < 2) {
          preview = `${univName} 입학처 전체 공지사항`;
        }
        const href = safeOpenUrl(it);
        if (!href) return null;
        return {
          univId,
          univName,
          title,
          preview: preview.slice(0, 110),
          dateISO: boardOnly ? "" : dateISO,
          href,
          priority: isPriorityUniv(univName) || Boolean(it.priority),
          boardOnly,
          hasNotice: !boardOnly,
        };
      }

      function mergeNoticePool(extra) {
        const map = new Map();
        univNoticePool.concat(extra || []).forEach((raw) => {
          const n = normalizeNotice(raw);
          if (!n) return;
          const key = `${n.univId}|${n.title}|${n.dateISO}|${n.boardOnly ? "b" : "n"}`;
          map.set(key, {
            univId: n.univId,
            univName: n.univName,
            title: n.title,
            preview: n.preview,
            url: n.href,
            homeUrl: raw.homeUrl || "",
            dateISO: n.dateISO,
            dateText: n.dateISO ? n.dateISO.replace(/-/g, ".") : "",
            priority: n.priority,
            boardOnly: n.boardOnly,
          });
        });
        univNoticePool = Array.from(map.values());
      }

      function ensurePriorityBoardRows() {
        const havePost = new Set(
          univNoticePool
            .filter((n) => n.dateISO && n.dateISO >= UNIV_MIN_DATE && !n.boardOnly)
            .map((n) => n.univId)
        );
        const extras = [];
        univPriority.forEach((p) => {
          if (!p.univId || havePost.has(p.univId)) return;
          const existsBoard = univNoticePool.some((n) => n.univId === p.univId && n.boardOnly);
          if (existsBoard) return;
          extras.push({
            univId: p.univId,
            univName: p.univName,
            title: `${p.univName} 입학처 전체 공지사항`,
            preview: "2026.08.01 이후 공지 · 입학처 게시판 바로가기",
            url: p.boardUrl || p.homeUrl,
            homeUrl: p.homeUrl,
            dateISO: "",
            priority: true,
            boardOnly: true,
          });
        });
        if (extras.length) mergeNoticePool(extras);
      }

      function buildUnivRows() {
        const today = seoulTodayISO();
        ensurePriorityBoardRows();

        const noticeRows = univNoticePool
          .map(normalizeNotice)
          .filter(Boolean)
          .filter((r) => r.priority || (r.dateISO && r.dateISO >= UNIV_MIN_DATE));

        // 우선 대학 공지(실제 글) 먼저, 그다음 우선 대학 게시판 링크, 나머지 대학
        const prioPosts = noticeRows.filter((r) => r.priority && r.hasNotice);
        const prioBoards = noticeRows.filter((r) => r.priority && r.boardOnly);
        const otherPosts = noticeRows.filter((r) => !r.priority && r.hasNotice);

        const covered = new Set(noticeRows.filter((r) => r.priority).map((r) => r.univId));
        const otherUnis = univSources
          .filter((s) => !covered.has(s.id) && !isPriorityUniv(s.name))
          .map((s) => {
            const href = safeOpenUrl({ univId: s.id, homeUrl: s.homeUrl, boardUrl: s.boardUrl, url: "" });
            if (!href) return null;
            return {
              univId: s.id,
              univName: s.name,
              title: `${s.name} 입학처 전체 공지사항`,
              preview: "모집요강 · 일정 · 합격 발표 등 입학처 공지",
              dateISO: "",
              href,
              priority: false,
              boardOnly: true,
              hasNotice: false,
            };
          })
          .filter(Boolean);

        const sortFn = (a, b) => {
          if (a.dateISO === today && b.dateISO !== today) return -1;
          if (b.dateISO === today && a.dateISO !== today) return 1;
          const ar = priorityRank(a.univName);
          const br = priorityRank(b.univName);
          if (a.priority && b.priority && ar !== br) return ar - br;
          if (a.dateISO !== b.dateISO) return String(b.dateISO).localeCompare(String(a.dateISO));
          return a.univName.localeCompare(b.univName, "ko");
        };

        prioPosts.sort(sortFn);
        prioBoards.sort((a, b) => priorityRank(a.univName) - priorityRank(b.univName));
        otherPosts.sort(sortFn);
        otherUnis.sort((a, b) => a.univName.localeCompare(b.univName, "ko"));

        return prioPosts.concat(prioBoards, otherPosts, otherUnis);
      }

      function filteredRows(query) {
        const q = String(query || "").trim().toLowerCase().replace(/\s+/g, "");
        const rows = buildUnivRows();
        if (!q) return rows;
        return rows.filter((r) => {
          const hay = `${r.title}${r.preview}${r.univName}`.toLowerCase().replace(/\s+/g, "");
          return hay.includes(q);
        });
      }

      function renderUnivBoard(query) {
        if (!univListEl) return;
        univQuery = query || "";
        const list = filteredRows(univQuery);
        const today = seoulTodayISO();
        const prioCount = list.filter((r) => r.priority && r.hasNotice).length;
        if (univCountEl) {
          univCountEl.textContent = univQuery
            ? `검색 ${list.length.toLocaleString("ko-KR")}건`
            : `우선공지 ${prioCount} · 전체 ${list.length.toLocaleString("ko-KR")}`;
        }

        if (!list.length) {
          univListEl.innerHTML = `<div class="univ-notice-empty">2026.08.01 이후 공지가 없습니다.</div>`;
          return;
        }

        let lastDate = null;
        univListEl.innerHTML = list.map((r) => {
          const title = escapeHtml(r.title);
          const preview = escapeHtml(r.preview);
          const univ = escapeHtml(r.univName);
          const href = escapeHtml(r.href);
          const isToday = r.dateISO && r.dateISO === today;
          const shortDate = r.dateISO ? escapeHtml(r.dateISO.slice(5).replace("-", ".")) : "";
          const dayKey = r.dateISO || "_none";
          const dayStart = dayKey !== lastDate;
          lastDate = dayKey;
          const cls = [
            "univ-notice-item",
            isToday ? "is-today" : "",
            dayStart ? "is-day-start" : "",
            r.priority ? "is-priority" : "",
          ].filter(Boolean).join(" ");
          return (
            `<div class="${cls}" data-href="${href}" role="link" tabindex="0" title="${univ} — ${title}">` +
            `<div class="univ-notice-item-body">` +
            `<div class="univ-notice-head">` +
            `<span class="univ-notice-univ">${univ}</span>` +
            (isToday ? `<span class="univ-notice-new">오늘</span>` : "") +
            `<span class="univ-notice-title">${title}</span>` +
            (shortDate ? `<span class="univ-notice-date">${shortDate}</span>` : "") +
            `</div>` +
            `<span class="univ-notice-preview">${preview}</span>` +
            `</div>` +
            `</div>`
          );
        }).join("");
      }

      function openNoticeUrl(url) {
        if (!url || !/^https?:\/\//i.test(url)) return;
        window.open(url, "_blank", "noopener,noreferrer");
      }

      function parsePriorityHtml(html, cfg, pageUrl) {
        if (!html || /HTTP 오류 404|404\.0 - Not Found|error404/i.test(html.slice(0, 2800))) return [];
        const out = [];
        const re = /<a[^>]+href\s*=\s*["']([^"']+)["'][^>]*>([\s\S]*?)<\/a>([\s\S]{0,300})/gi;
        let m;
        while ((m = re.exec(html)) && out.length < 6) {
          const href = m[1];
          const title = stripTags(m[2]);
          const tail = stripTags(m[3]);
          if (!title || title.length < 8 || title.length > 140 || isJunkText(title)) continue;
          if ((title.match(/[가-힣]/g) || []).length < 4) continue;
          if (!/(notice|bbs|board|article|artcl|공지|소식|news|view|Board)/i.test(href) &&
              !/(공지|안내|모집|요강|발표|일정|변경|합격|전형|수시|정시)/.test(title)) continue;
          const dateISO = extractDateISO(tail) || extractDateISO(title);
          if (!dateISO || dateISO < UNIV_MIN_DATE) continue;
          const abs = toAbsUrl(href, pageUrl);
          if (!abs || /error404|notice\.asp$/i.test(abs)) continue;
          let preview = tail.replace(/(20\d{2})\s*[.\-/년]\s*(\d{1,2})\s*[.\-/월]\s*(\d{1,2})/g, " ").replace(/\s+/g, " ").trim();
          if (isJunkText(preview) || (preview.match(/[가-힣]/g) || []).length < 2) {
            preview = `${cfg.univName} 입학처 전체 공지사항`;
          }
          out.push({
            univId: cfg.univId,
            univName: cfg.univName,
            title,
            preview: preview.slice(0, 110),
            url: abs,
            homeUrl: cfg.homeUrl,
            dateISO,
            dateText: dateISO.replace(/-/g, "."),
            priority: true,
          });
        }
        return out;
      }

      async function fetchHtmlProxy(url) {
        const proxies = [
          (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
          (u) => `https://corsproxy.io/?${encodeURIComponent(u)}`,
        ];
        for (const make of proxies) {
          try {
            const res = await fetch(make(url), { cache: "no-store" });
            if (!res.ok) continue;
            const text = await res.text();
            if (text && text.length > 500) return text;
          } catch {
            /* next */
          }
        }
        return "";
      }

      async function refreshPriorityLive() {
        if (univLiveBusy || !univPriority.length) return;
        univLiveBusy = true;
        setUnivLive(true, "LIVE");
        try {
          const batchSize = 4;
          for (let i = 0; i < univPriority.length; i += batchSize) {
            const slice = univPriority.slice(i, i + batchSize);
            const parts = await Promise.all(
              slice.map(async (cfg) => {
                const urls = [cfg.boardUrl, cfg.homeUrl].filter(Boolean);
                for (const u of urls) {
                  const html = await fetchHtmlProxy(u);
                  if (!html) continue;
                  const items = parsePriorityHtml(html, cfg, u);
                  if (items.length) return items;
                }
                return [];
              })
            );
            const flat = parts.flat();
            if (flat.length) {
              mergeNoticePool(flat);
              renderUnivBoard(univQuery);
            }
          }
          setUnivLive(true, "LIVE");
        } catch {
          setUnivLive(true, "READY");
        } finally {
          univLiveBusy = false;
        }
      }

      if (univListEl) {
        univListEl.addEventListener("click", (e) => {
          const row = e.target.closest(".univ-notice-item[data-href]");
          if (!row) return;
          openNoticeUrl(row.getAttribute("data-href"));
        });
        univListEl.addEventListener("keydown", (e) => {
          if (e.key !== "Enter" && e.key !== " ") return;
          const row = e.target.closest(".univ-notice-item[data-href]");
          if (!row) return;
          e.preventDefault();
          openNoticeUrl(row.getAttribute("data-href"));
        });
      }

      if (univSearch) {
        univSearch.addEventListener("input", () => {
          renderUnivBoard(univSearch.value);
        });
      }

      function bootUnivNotices() {
        if (!univSources.length && !univPriority.length) {
          setUnivLive(false, "오류");
          renderUnivBoard("");
          return;
        }
        mergeNoticePool(univNoticePool);
        setUnivLive(true, "READY");
        renderUnivBoard(univSearch ? univSearch.value : "");
        // 우선 22개 대학 실시간 갱신
        setTimeout(() => refreshPriorityLive(), 300);
        setInterval(() => refreshPriorityLive(), UNIV_LIVE_MS);
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") refreshPriorityLive();
        });
      }

      const expandPanel = document.getElementById("expandPanel");
      const expandFrame = document.getElementById("expandFrame");
      const expandTitle = document.getElementById("expandTitle");
      const expandOpen = document.getElementById("expandOpen");
      const expandClose = document.getElementById("expandClose");
      const expandMarkSvg = document.getElementById("expandMarkSvg");
      const expandNavMap = {
        susi: document.getElementById("susiNav"),
        ipgyeol: document.getElementById("ipgyeolNav"),
      };
      let activeExpandKey = null;

      function closeExpand() {
        if (!expandPanel) return;
        expandPanel.classList.remove("is-open");
        Object.values(expandNavMap).forEach((nav) => {
          if (!nav) return;
          nav.classList.remove("is-active");
          nav.setAttribute("aria-expanded", "false");
        });
        activeExpandKey = null;
      }

      function openExpand(key) {
        const app = EXPAND_APPS[key];
        const nav = expandNavMap[key];
        if (!app || !expandPanel || !expandFrame || !nav) return;

        if (activeExpandKey === key && expandPanel.classList.contains("is-open")) {
          closeExpand();
          return;
        }

        Object.values(expandNavMap).forEach((item) => {
          if (!item) return;
          item.classList.remove("is-active");
          item.setAttribute("aria-expanded", "false");
        });

        expandPanel.dataset.theme = app.theme;
        expandTitle.textContent = app.title;
        expandFrame.title = app.title;
        expandOpen.href = app.url;
        if (expandMarkSvg) expandMarkSvg.innerHTML = app.mark;
        if (expandFrame.getAttribute("src") !== app.url) {
          expandFrame.src = app.url;
        }

        expandPanel.classList.add("is-open");
        nav.classList.add("is-active");
        nav.setAttribute("aria-expanded", "true");
        activeExpandKey = key;

        requestAnimationFrame(() => {
          expandPanel.scrollIntoView({ behavior: "smooth", block: "start" });
        });
      }

      Object.entries(expandNavMap).forEach(([key, nav]) => {
        if (!nav) return;
        nav.addEventListener("click", (e) => {
          e.preventDefault();
          openExpand(key);
        });
      });

      if (expandClose) expandClose.addEventListener("click", closeExpand);

      const brandHome = document.querySelector(".nav-brand");
      if (brandHome) {
        brandHome.addEventListener("click", (e) => {
          const host = decodeURIComponent(location.hostname);
          const onSite =
            host === "www.김태훈.com" ||
            host === "김태훈.com" ||
            host.endsWith(".김태훈.com") ||
            location.protocol === "file:";
          if (!onSite) return;
          e.preventDefault();
          closeExpand();
          if (location.hash) history.replaceState(null, "", location.pathname + location.search);
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      }

      if (location.hash === "#susi") openExpand("susi");
      if (location.hash === "#ipgyeol") openExpand("ipgyeol");

      /* ── 방문자 카운터 + 통계 ── */
      const VISIT_STORE_KEY = "kimtaehoon_visit_v3";
      const VISIT_NS = "kimtaehoon-com";
      const COUNT_API = "https://countapi.mileshilliard.com/api/v1";
      const visitTodayEl = document.getElementById("visitToday");
      const visitTotalEl = document.getElementById("visitTotal");
      const visitStatsBtn = document.getElementById("visitStatsBtn");
      const visitStatsModal = document.getElementById("visitStatsModal");
      const visitStatsClose = document.getElementById("visitStatsClose");
      const visitStatsChart = document.getElementById("visitStatsChart");
      const visitStatsTodayEl = document.getElementById("visitStatsToday");
      const visitStatsTotalEl = document.getElementById("visitStatsTotal");
      let visitState = { today: 0, total: 0, date: "", hit: false, days: {} };

      function seoulDateKey(d = new Date()) {
        const parts = new Intl.DateTimeFormat("en-CA", {
          timeZone: "Asia/Seoul",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
        }).formatToParts(d);
        const get = (t) => parts.find((p) => p.type === t)?.value || "00";
        return `${get("year")}-${get("month")}-${get("day")}`;
      }

      function formatVisit(n) {
        return Number(n || 0).toLocaleString("ko-KR");
      }

      function animateVisitNum(el, to) {
        if (!el) return;
        el.classList.remove("is-loading");
        const target = Math.max(0, Math.floor(Number(to) || 0));
        el.textContent = formatVisit(target);
      }

      function readVisitState() {
        try {
          const raw = localStorage.getItem(VISIT_STORE_KEY);
          const data = raw ? JSON.parse(raw) : null;
          if (!data || typeof data !== "object") {
            return { today: 0, total: 0, date: "", hit: false, days: {} };
          }
          return {
            today: Math.max(0, Number(data.today) || 0),
            total: Math.max(0, Number(data.total) || 0),
            date: String(data.date || ""),
            hit: Boolean(data.hit),
            days: data.days && typeof data.days === "object" ? data.days : {},
          };
        } catch {
          return { today: 0, total: 0, date: "", hit: false, days: {} };
        }
      }

      function writeVisitState(data) {
        visitState = data;
        try {
          localStorage.setItem(VISIT_STORE_KEY, JSON.stringify(data));
        } catch {
          /* ignore */
        }
      }

      function syncVisitDay(data, today) {
        if (data.date !== today) {
          data.date = today;
          data.today = 0;
          data.hit = false;
        }
        if (!data.days || typeof data.days !== "object") data.days = {};
        return data;
      }

      function parseCountValue(json) {
        if (!json || json.error) return null;
        const n = Number(json.value);
        return Number.isFinite(n) ? Math.max(0, Math.floor(n)) : null;
      }

      async function countApi(path) {
        const res = await fetch(`${COUNT_API}/${path}`, {
          method: "GET",
          credentials: "omit",
          cache: "no-store",
        });
        if (!res.ok) throw new Error("count_http_" + res.status);
        return res.json();
      }

      async function readCount(key) {
        try {
          const n = parseCountValue(await countApi("get/" + encodeURIComponent(key)));
          return n;
        } catch {
          return null;
        }
      }

      async function hitCount(key) {
        const n = parseCountValue(await countApi("hit/" + encodeURIComponent(key)));
        if (n == null) throw new Error("count_bad");
        return n;
      }

      function applyVisitDisplay(todayN, totalN) {
        animateVisitNum(visitTodayEl, todayN);
        animateVisitNum(visitTotalEl, totalN);
        if (visitStatsTodayEl) visitStatsTodayEl.textContent = formatVisit(todayN);
        if (visitStatsTotalEl) visitStatsTotalEl.textContent = formatVisit(totalN);
      }

      function last7Days(today) {
        const out = [];
        const base = new Date(today + "T12:00:00+09:00");
        for (let i = 6; i >= 0; i--) {
          const d = new Date(base.getTime() - i * 86400000);
          out.push(seoulDateKey(d));
        }
        return out;
      }

      function renderVisitChart() {
        if (!visitStatsChart) return;
        const today = seoulDateKey();
        const days = last7Days(today);
        const vals = days.map((d) => Math.max(0, Number(visitState.days[d]) || 0));
        const max = Math.max(1, ...vals);
        visitStatsChart.innerHTML = days.map((d, i) => {
          const v = vals[i];
          const h = Math.max(4, Math.round((v / max) * 72));
          const label = d.slice(5).replace("-", ".");
          const isToday = d === today;
          return (
            `<div class="visit-stats-bar-wrap" title="${label}: ${v}">` +
            `<span class="visit-stats-bar-val">${v}</span>` +
            `<div class="visit-stats-bar${isToday ? " is-today" : ""}" style="height:${h}px"></div>` +
            `<span class="visit-stats-bar-label">${label}</span>` +
            `</div>`
          );
        }).join("");
      }

      function openVisitStats() {
        if (!visitStatsModal) return;
        renderVisitChart();
        applyVisitDisplay(visitState.today, visitState.total);
        visitStatsModal.hidden = false;
        visitStatsModal.classList.add("is-open");
      }

      function closeVisitStats() {
        if (!visitStatsModal) return;
        visitStatsModal.classList.remove("is-open");
        visitStatsModal.hidden = true;
      }

      async function bootVisits() {
        if (!visitTodayEl || !visitTotalEl) return;

        const today = seoulDateKey();
        const totalKey = VISIT_NS + "-total-v1";
        const dayKey = VISIT_NS + "-day-" + today;
        let data = syncVisitDay(readVisitState(), today);
        applyVisitDisplay(data.today, data.total);

        // 새로고침·재방문마다 +1 (페이지 로드 시마다 카운트)
        try {
          const [dayRes, totalRes] = await Promise.all([
            hitCount(dayKey),
            hitCount(totalKey),
          ]);
          const todayN = Math.max(data.today + 1, dayRes);
          const totalN = Math.max(data.total + 1, totalRes);
          data.today = todayN;
          data.total = totalN;
          data.date = today;
          data.hit = true;
          data.days[today] = todayN;
          writeVisitState(data);
          applyVisitDisplay(todayN, totalN);
        } catch {
          data.today += 1;
          data.total += 1;
          data.date = today;
          data.hit = true;
          data.days[today] = data.today;
          writeVisitState(data);
          applyVisitDisplay(data.today, data.total);
        }
      }

      if (visitStatsBtn) {
        visitStatsBtn.addEventListener("click", (e) => {
          e.preventDefault();
          openVisitStats();
        });
      }
      if (visitStatsClose) visitStatsClose.addEventListener("click", closeVisitStats);
      if (visitStatsModal) {
        visitStatsModal.addEventListener("click", (e) => {
          if (e.target === visitStatsModal) closeVisitStats();
        });
      }
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeVisitStats();
      });

      bootUnivNotices();
      bootVisits();
    })();
  </script>
</body>
</html>
