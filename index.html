<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="김태훈닷컴 — 대입정보·학급 진학관리·오픈채팅 바로가기와 실시간 대화" />
  <meta name="theme-color" content="#FA2D48" />
  <title>김태훈닷컴</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-primary-50: #FEE8EC;
      --color-primary-100: #FDC1CB;
      --color-primary-300: #FA6883;
      --color-primary-400: #FA4866;
      --color-primary-500: #FA2D48;
      --color-primary-600: #E01539;
      --color-primary-700: #B30D2D;
      --color-secondary-500: #FF5577;

      --color-neutral-0: #FFFFFF;
      --color-neutral-50: #F2F2F7;
      --color-neutral-100: #E5E5EA;
      --color-neutral-200: #D1D1D6;
      --color-neutral-300: #A8A8AD;
      --color-neutral-500: #636366;
      --color-neutral-700: #2C2C2E;
      --color-neutral-800: #1C1C1E;
      --color-neutral-900: #0A0A0A;
      --color-neutral-1000: #000000;

      --bg-base: #FFFFFF;
      --bg-subtle: #F2F2F7;
      --bg-elevated: #FFFFFF;
      --text-primary: #000000;
      --text-secondary: #1C1C1E;
      --text-tertiary: #636366;
      --text-on-primary: #FFFFFF;
      --border-default: #E5E5EA;
      --border-strong: #D1D1D6;
      --border-focus: #FA2D48;

      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --space-2xl: 48px;
      --space-3xl: 72px;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 22px;
      --radius-full: 9999px;

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.08);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.12);
      --shadow-lg: 0 18px 42px rgba(0, 0, 0, 0.16);
      --shadow-art: 0 18px 36px rgba(250, 45, 72, 0.24);

      --duration-fast: 120ms;
      --duration-base: 240ms;
      --duration-slow: 400ms;
      --ease-out: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

      --kakao-yellow: #FEE500;
      --kakao-fg: #191919;
      --kakao-muted: #888888;
      --kakao-chat-bg: #B2C7DA;
      --kakao-surface: #FFFFFF;
      --kakao-border: #F0F0F0;

      --container: 1080px;
      --font: "Noto Sans KR", "Noto Sans", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-base: #000000;
        --bg-subtle: #0A0A0A;
        --bg-elevated: #0A0A0A;
        --text-primary: #F5F5F7;
        --text-secondary: #F5F5F7;
        --text-tertiary: #8E8E93;
        --border-default: #222226;
        --border-strong: #2C2C2E;
        --color-primary-500: #FF3B58;
        --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);
        --shadow-lg: 0 18px 42px rgba(0, 0, 0, 0.55);
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      background: var(--bg-base);
      color: var(--text-primary);
      letter-spacing: 0;
      line-height: 1.6;
      word-break: keep-all;
      overflow-wrap: break-word;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea {
      font: inherit;
      letter-spacing: inherit;
    }

    img,
    svg {
      display: block;
      max-width: 100%;
    }

    .shell {
      min-height: 100vh;
      background:
        radial-gradient(70% 55% at 50% -8%, rgba(250, 45, 72, 0.14), transparent 62%),
        radial-gradient(45% 35% at 92% 18%, rgba(255, 85, 119, 0.08), transparent 55%),
        linear-gradient(180deg, var(--bg-base) 0%, var(--bg-subtle) 100%);
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 40;
      min-height: 64px;
      padding: 8px clamp(12px, 3vw, 24px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      background: color-mix(in srgb, var(--bg-base) 84%, transparent);
      border-bottom: 1px solid var(--border-default);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      justify-self: start;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }

    .nav-brand:hover .brand-name {
      color: var(--red, #FA2D48);
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(145deg, #FF6482 0%, #FA2D48 55%, #D60035 100%);
      box-shadow: 0 5px 15px rgba(250, 45, 72, 0.25);
      animation: markPulse 3.6s var(--ease-out) infinite;
    }

    .brand-mark svg {
      width: 15px;
      height: 15px;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.3;
      white-space: nowrap;
    }

    .nav-links {
      justify-self: center;
      display: flex;
      align-items: stretch;
      gap: clamp(3px, 0.8vw, 8px);
      max-width: min(980px, 78vw);
    }

    .nav-sep {
      width: 1px;
      align-self: stretch;
      margin: 4px 4px;
      flex: 0 0 1px;
      background: linear-gradient(
        180deg,
        transparent 0%,
        var(--border-strong) 18%,
        var(--border-strong) 82%,
        transparent 100%
      );
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 4px;
      min-width: 0;
      flex: 1 1 0;
      padding: 4px 4px 5px;
      border-radius: 12px;
      text-align: center;
      transition:
        transform var(--duration-fast) var(--ease-out),
        background var(--duration-fast) var(--ease-out);
    }

    .nav-item:hover,
    .nav-item:focus-visible {
      background: color-mix(in srgb, var(--color-primary-500) 8%, transparent);
      transform: translateY(-1px);
      outline: none;
    }

    .nav-item:active {
      transform: scale(0.97);
    }

    .nav-item .ic {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--icon-bg);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
      flex: 0 0 auto;
    }

    .nav-item .ic svg {
      width: 15px;
      height: 15px;
    }

    .nav-item.card-a .ic-aura {
      position: relative;
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .nav-item.card-a .ic-aura::before,
    .nav-item.card-a .ic-aura::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 10px;
      background: conic-gradient(
        from 0deg,
        #ff4d6d,
        #ff9f1c,
        #ffd60a,
        #2ec4b6,
        #4cc9f0,
        #7b2cbf,
        #f72585,
        #ff4d6d
      );
      pointer-events: none;
    }

    .nav-item.card-a .ic-aura::before {
      inset: -3px;
      filter: blur(8px);
      opacity: 0.5;
      animation:
        rainbowOrbit 4s linear infinite,
        rainbowBreath 2.8s ease-in-out infinite;
    }

    .nav-item.card-a .ic-aura::after {
      animation: rainbowOrbit 4s linear infinite;
    }

    .nav-item.card-a .ic {
      position: relative;
      z-index: 1;
      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }

    .nav-item.card-a:hover .ic-aura::before {
      opacity: 0.72;
      filter: blur(9px);
    }

    @keyframes rainbowOrbit {
      to { transform: rotate(360deg); }
    }

    @keyframes rainbowBreath {
      0%, 100% { opacity: 0.42; }
      50% { opacity: 0.68; }
    }

    .nav-item.card-c .ic,
    .nav-item.card-d .ic,
    .nav-item.card-e .ic {
      color: #191919;
      box-shadow: 0 4px 10px rgba(200, 170, 0, 0.22);
    }

    .nav-item em {
      font-style: normal;
      font-size: 9px;
      font-weight: 650;
      line-height: 1.25;
      letter-spacing: -0.02em;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: keep-all;
      max-width: 100%;
    }

    .card-a { --icon-bg: linear-gradient(145deg, #FF8D72 0%, #FA2D48 48%, #5F1235 100%); }
    .card-b { --icon-bg: linear-gradient(135deg, #5D68FF 0%, #B846CE 47%, #FF5577 100%); }
    .card-f { --icon-bg: linear-gradient(145deg, #5AC8FA 0%, #007AFF 48%, #003D7A 100%); }
    .card-g { --icon-bg: linear-gradient(145deg, #FFB340 0%, #FF9500 48%, #C2410C 100%); }
    .card-h { --icon-bg: linear-gradient(145deg, #34C759 0%, #30B0C7 48%, #0A6B6B 100%); }
    .card-c { --icon-bg: linear-gradient(145deg, #FFE566 0%, #FEE500 45%, #C9A800 100%); }
    .card-d { --icon-bg: linear-gradient(145deg, #FFE27A 0%, #FFC107 50%, #E09B00 100%); }
    .card-e { --icon-bg: linear-gradient(145deg, #FFF1A0 0%, #FEE500 40%, #D4AF00 100%); }
    .card-i { --icon-bg: linear-gradient(145deg, #A78BFA 0%, #7C3AED 48%, #4C1D95 100%); }

    .nav-item.is-placeholder {
      cursor: default;
      pointer-events: none;
    }

    .nav-item.is-placeholder:hover,
    .nav-item.is-placeholder:focus-visible {
      background: transparent;
      transform: none;
    }

    .nav-item.is-active {
      background: color-mix(in srgb, var(--color-primary-500) 14%, transparent);
    }

    .nav-actions {
      justify-self: end;
      display: flex;
      align-items: center;
    }

    .inquiry-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px 7px 8px;
      border-radius: var(--radius-full);
      background: #191919;
      color: #FEE500;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.3;
      box-shadow: 0 6px 16px rgba(25, 25, 25, 0.16);
      transition: transform var(--duration-fast) var(--ease-out), background var(--duration-fast) var(--ease-out);
    }

    .inquiry-btn:hover,
    .inquiry-btn:focus-visible {
      transform: translateY(-1px) scale(1.02);
      background: #2c2c2e;
      outline: none;
    }

    .inquiry-btn:active {
      transform: scale(0.97);
    }

    .inquiry-btn .ic {
      width: 22px;
      height: 22px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #FEE500;
      color: #191919;
    }

    .inquiry-btn .ic svg {
      width: 14px;
      height: 14px;
    }

    .container {
      width: min(var(--container), 100%);
      margin: 0 auto;
      padding: 0 clamp(16px, 4vw, 24px);
    }

    .upper-layout {
      position: relative;
      background: var(--bg-base);
      isolation: isolate;
    }

    .upper-layout .nav {
      border-bottom: 1px solid var(--border-default);
    }

    .upper-stage {
      width: min(1280px, 100%);
      margin: 0 auto;
      padding: 0 clamp(12px, 3vw, 20px);
      display: grid;
      gap: clamp(12px, 2vw, 20px);
      align-content: start;
    }

    .upper-stage:has(.expand-panel.is-open) {
      padding-top: clamp(16px, 2.5vw, 24px);
      padding-bottom: clamp(16px, 2.5vw, 24px);
    }

    .stage-rule {
      height: 4px;
      width: 100%;
      margin: 0;
      border: 0;
      background: #191919;
      flex-shrink: 0;
    }

    .lower-layout {
      background:
        radial-gradient(70% 55% at 50% -8%, rgba(250, 45, 72, 0.1), transparent 62%),
        linear-gradient(180deg, var(--bg-subtle) 0%, color-mix(in srgb, var(--bg-subtle) 88%, var(--color-primary-50)) 100%);
      padding-bottom: 80px;
    }

    .chat-section {
      padding: clamp(20px, 3vw, 28px) clamp(12px, 3vw, 20px) clamp(48px, 8vw, 88px);
      width: min(1280px, 100%);
      margin: 0 auto;
    }

    .expand-panel {
      display: none;
      width: 100%;
      margin: 0;
      padding: 0;
      animation: riseIn 0.35s var(--ease-out) both;
    }

    .expand-panel.is-open {
      display: block;
    }
    .expand-panel[data-theme="susi"] {
      --expand-accent: #34C759;
      --expand-mark: linear-gradient(145deg, #34C759 0%, #30B0C7 55%, #0A6B6B 100%);
    }

    .expand-panel[data-theme="ipgyeol"] {
      --expand-accent: #007AFF;
      --expand-mark: linear-gradient(145deg, #5AC8FA 0%, #007AFF 55%, #003D7A 100%);
    }

    .expand-shell {
      overflow: hidden;
      border: 4px solid #191919;
      border-radius: 28px;
      background: var(--bg-elevated);
      box-shadow: 0 24px 50px rgba(25, 25, 25, 0.2);
      min-height: min(82vh, 920px);
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .expand-bar {
      min-height: 56px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      background: color-mix(in srgb, var(--bg-elevated) 90%, var(--expand-accent, #34C759));
      border-bottom: 1px solid var(--border-default);
    }

    .expand-mark {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--expand-mark, linear-gradient(145deg, #34C759 0%, #30B0C7 55%, #0A6B6B 100%));
      flex: 0 0 auto;
    }

    .expand-mark svg {
      width: 15px;
      height: 15px;
    }

    .expand-bar strong {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.4;
      word-break: keep-all;
    }

    .expand-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .expand-open,
    .expand-close {
      border: 0;
      border-radius: var(--radius-full);
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.3;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform var(--duration-fast) var(--ease-out), background var(--duration-fast) var(--ease-out);
    }

    .expand-open {
      background: #191919;
      color: #fff;
    }

    .expand-close {
      background: var(--color-neutral-100);
      color: var(--text-primary);
    }

    @media (prefers-color-scheme: dark) {
      .expand-close {
        background: #2C2C2E;
      }
    }

    .expand-open:hover,
    .expand-close:hover {
      transform: translateY(-1px);
    }

    .expand-frame-wrap {
      min-height: 0;
      background: #f2f2f7;
    }

    .expand-frame {
      width: 100%;
      height: min(76vh, 860px);
      border: 0;
      display: block;
      background: #fff;
    }

    .chat-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: clamp(16px, 2.4vw, 24px);
      align-items: stretch;
      padding: clamp(8px, 2vw, 16px) 0;
    }

    .board-panel {
      min-width: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 680px;
      max-height: min(860px, 88vh);
      border: 4px solid #191919;
      border-radius: 34px;
      background: var(--bg-elevated);
      box-shadow: 0 24px 50px rgba(25, 25, 25, 0.22);
      overflow: hidden;
      animation: riseIn 0.65s var(--ease-out) both;
    }

    .board-bar {
      min-height: 42px;
      height: auto;
      padding: 6px 12px 6px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: color-mix(in srgb, var(--bg-elevated) 92%, var(--color-primary-50));
      border-bottom: 1px solid var(--border-default);
    }

    .board-mark {
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(145deg, #FF8D72 0%, #FA2D48 52%, #7A0820 100%);
      box-shadow: 0 4px 10px rgba(250, 45, 72, 0.22);
    }

    .board-mark svg {
      width: 13px;
      height: 13px;
    }

    .board-bar strong {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.35;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    .board-bar .board-title {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
      padding-top: 0;
    }

    .board-open {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      border-radius: var(--radius-full);
      background: var(--color-primary-500);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.01em;
      box-shadow: 0 6px 14px rgba(250, 45, 72, 0.2);
      transition: transform var(--duration-fast) var(--ease-out), background var(--duration-fast) var(--ease-out);
      white-space: nowrap;
      flex: 0 0 auto;
    }

    .board-open:hover,
    .board-open:focus-visible {
      transform: translateY(-1px) scale(1.02);
      background: var(--color-primary-400);
      outline: none;
    }

    .board-open:active {
      transform: scale(0.97);
    }

    .board-open svg {
      width: 12px;
      height: 12px;
    }

    .board-frame-wrap {
      position: relative;
      min-height: 0;
      overflow: auto;
      background: #c6d6e4;
      -webkit-overflow-scrolling: touch;
    }

    .board-frame {
      width: 100%;
      height: 100%;
      min-width: 100%;
      border: 0;
      display: block;
      background: #c6d6e4;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: rgba(25, 25, 25, 0.25) transparent;
    }

    .board-frame::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .board-frame::-webkit-scrollbar-thumb {
      background: rgba(25, 25, 25, 0.22);
      border-radius: 999px;
    }

    .board-frame::-webkit-scrollbar-track {
      background: transparent;
    }

    .board-fallback {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      padding: 28px 20px;
      text-align: center;
      background: color-mix(in srgb, var(--bg-elevated) 92%, transparent);
    }

    .board-fallback.show {
      display: grid;
    }

    .board-fallback-card {
      width: min(360px, 100%);
      padding: 28px 22px;
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      background: var(--bg-elevated);
      box-shadow: var(--shadow-md);
    }

    .board-fallback-card .art {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(145deg, #FF8D72 0%, #FA2D48 52%, #7A0820 100%);
      box-shadow: var(--shadow-art);
    }

    .board-fallback-card .art svg {
      width: 30px;
      height: 30px;
    }

    .board-fallback-card h3 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.35;
    }

    .board-fallback-card p {
      margin: 0 0 18px;
      color: var(--text-tertiary);
      font-size: 13px;
      font-weight: 500;
      line-height: 1.6;
    }

    .univ-notice-panel {
      min-width: 0;
      display: grid;
      grid-template-rows: auto auto 1fr;
      min-height: 680px;
      max-height: min(860px, 88vh);
      border: 4px solid #191919;
      border-radius: 34px;
      background:
        radial-gradient(80% 50% at 8% 0%, rgba(255, 214, 228, 0.45), transparent 58%),

  <script>
    (() => {
      "use strict";

      /**
       * ★ 대학별 공지 안내 게시판 Apps Script 웹앱 URL
       * univ-notice-backend.gs 배포 후 아래에 넣으세요.
       */
      const UNIV_NOTICE_API_URL = "";
      /**
       * ★ 방문자 통계용 Apps Script (chat-backend.gs 배포 URL)
       */
      const VISIT_API_URL = "";
      const EXPAND_APPS = {
        susi: {
          url: "https://script.google.com/macros/s/AKfycbzz9D4B0fHSk_KykVKuUjNtPeEzrtGtGnzytPWqKpSGTilQSRh8sKPnzEHRacmJGb27Qg/exec",
          title: "2027 수시 일정",
          theme: "susi",
          mark: `<rect x="4" y="5" width="16" height="15" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M8 3.5v4M16 3.5v4M5 10h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>`,
        },
        ipgyeol: {
          url: "https://script.google.com/macros/s/AKfycbwIg3mpzLDxQ8eMlDmH2g-c_QqKpjXlE6K7EpnJ8TRxQjIVLSTfEOnAkW0vW4Y85EEf/exec",
          title: "2026 입결 검색기",
          theme: "ipgyeol",
          mark: `<circle cx="11" cy="11" r="5.2" stroke="currentColor" stroke-width="1.8"/><path d="m15 15 4.2 4.2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>`,
        },
      };
      const UNIV_POLL_MS = 35000;
      const UNIV_MIN_DATE = "2026-08-01";

      const toast = document.getElementById("toast");
      const boardFrame = document.getElementById("boardFrame");
      const boardFallback = document.getElementById("boardFallback");
      const univListEl = document.getElementById("univNoticeList");
      const univCountEl = document.getElementById("univNoticeCount");
      const univUpdatedEl = document.getElementById("univNoticeUpdated");
      const univLive = document.getElementById("univNoticeLive");
      const univLiveLabel = document.getElementById("univNoticeLiveLabel");
      const univRefreshBtn = document.getElementById("univNoticeRefresh");

      if (boardFrame && boardFallback) {
        boardFrame.addEventListener("error", () => {
          boardFallback.classList.add("show");
        });
      }

      let univItems = [];
      let univUpdatedAt = "";
      let univOnline = false;

      function showToast(text) {
        if (!toast) return;
        toast.textContent = text;
        toast.classList.add("show");
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => toast.classList.remove("show"), 2200);
      }

      function escapeHtml(str) {
        return String(str)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function setUnivLive(online, label) {
        univOnline = online;
        if (!univLive || !univLiveLabel) return;
        univLive.classList.toggle("is-offline", !online);
        univLiveLabel.textContent = label;
      }

      function formatKst(iso) {
        if (!iso) return "—";
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return String(iso);
        return d.toLocaleString("ko-KR", {
          timeZone: "Asia/Seoul",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function seoulTodayISO() {
        const parts = new Intl.DateTimeFormat("en-CA", {
          timeZone: "Asia/Seoul",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
        }).formatToParts(new Date());
        const get = (t) => parts.find((p) => p.type === t)?.value || "00";
        return `${get("year")}-${get("month")}-${get("day")}`;
      }

      function isTodayDate(dateISO) {
        if (!dateISO) return false;
        return String(dateISO).slice(0, 10) === seoulTodayISO();
      }

      function isRecentDate(dateISO) {
        if (!dateISO) return false;
        const d = new Date(dateISO + "T00:00:00+09:00");
        if (Number.isNaN(d.getTime())) return false;
        const now = Date.now();
        const diff = now - d.getTime();
        return diff >= 0 && diff <= 7 * 24 * 60 * 60 * 1000;
      }

      function sanitizeItems(items) {
        return (Array.isArray(items) ? items : [])
          .filter((it) => {
            if (!it || !it.title || !it.url || !it.univName || !it.dateISO) return false;
            if (!/^https?:\/\//i.test(String(it.url))) return false;
            if (String(it.dateISO) < UNIV_MIN_DATE) return false;
            return true;
          })
          .sort((a, b) => {
            if (a.dateISO === b.dateISO) return String(b.fetchedAt || "").localeCompare(String(a.fetchedAt || ""));
            return a.dateISO < b.dateISO ? 1 : -1;
          });
      }

      function renderUnivNotices(items, updatedAt) {
        if (!univListEl) return;
        const list = sanitizeItems(items);
        univItems = list;
        univUpdatedAt = updatedAt || univUpdatedAt;
        if (univCountEl) univCountEl.textContent = "총 " + list.length.toLocaleString("ko-KR") + "건";
        if (univUpdatedEl) univUpdatedEl.textContent = "업데이트: " + formatKst(univUpdatedAt);

        if (!list.length) {
          univListEl.innerHTML = UNIV_NOTICE_API_URL
            ? `<div class="univ-notice-empty">표시할 공지가 없습니다.<br />기준일(2026.08.01) 이후·수집된 글만 노출됩니다.</div>`
            : `<div class="univ-notice-empty">univ-notice-backend.gs 를 배포한 뒤<br />UNIV_NOTICE_API_URL 을 설정해 주세요.</div>`;
          return;
        }

        univListEl.innerHTML = list.map((it) => {
          const today = isTodayDate(it.dateISO);
          const recent = !today && isRecentDate(it.dateISO);
          const dateText = escapeHtml(it.dateText || String(it.dateISO).replace(/-/g, "."));
          const univ = escapeHtml(it.univName);
          const title = escapeHtml(it.title);
          const url = escapeHtml(it.url);
          const home = escapeHtml(it.homeUrl || "");
          const rowClass = today ? " is-today" : recent ? " is-recent" : "";
          return (
            `<div class="univ-notice-item${rowClass}" data-href="${url}" role="link" tabindex="0">` +
            `<div class="univ-notice-date-wrap"><span class="univ-notice-date">${dateText}</span>` +
            (today || recent ? `<span class="univ-notice-new">NEW</span>` : "") +
            `</div>` +
            (home
              ? `<a class="univ-notice-univ" href="${home}" target="_blank" rel="noopener noreferrer" title="입학처 바로가기">${univ}</a>`
              : `<span class="univ-notice-univ">${univ}</span>`) +
            `<span class="univ-notice-title">${title}</span>` +
            `</div>`
          );
        }).join("");
      }

      function openNoticeUrl(url) {
        if (!url || !/^https?:\/\//i.test(url)) return;
        window.open(url, "_blank", "noopener,noreferrer");
      }

      if (univListEl) {
        univListEl.addEventListener("click", (e) => {
          const univLink = e.target.closest("a.univ-notice-univ");
          if (univLink) {
            e.stopPropagation();
            return;
          }
          const row = e.target.closest(".univ-notice-item[data-href]");
          if (!row) return;
          openNoticeUrl(row.getAttribute("data-href"));
        });
        univListEl.addEventListener("keydown", (e) => {
          if (e.key !== "Enter" && e.key !== " ") return;
          const row = e.target.closest(".univ-notice-item[data-href]");
          if (!row) return;
          e.preventDefault();
          openNoticeUrl(row.getAttribute("data-href"));
        });
      }

      async function fetchUnivList(forceRefresh) {
        if (!UNIV_NOTICE_API_URL) {
          setUnivLive(false, "미설정");
          renderUnivNotices([], "");
          return false;
        }
        try {
          const action = forceRefresh ? "refresh" : "list";
          const res = await fetch(`${UNIV_NOTICE_API_URL}?action=${action}`, {
            method: "GET",
            cache: "no-store",
            redirect: "follow",
          });
          if (!res.ok) throw new Error("http_" + res.status);
          const data = await res.json();
          if (!data || data.ok === false) throw new Error(data && data.error ? data.error : "bad_payload");
          const items = sanitizeItems(data.items);
          if (!items.length && univItems.length && !forceRefresh) {
            setUnivLive(true, "LIVE");
            if (univUpdatedEl && data.updatedAt) {
              univUpdatedAt = data.updatedAt;
              univUpdatedEl.textContent = "업데이트: " + formatKst(univUpdatedAt);
            }
            return true;
          }
          renderUnivNotices(items, data.updatedAt || "");
          setUnivLive(true, "LIVE");
          return true;
        } catch (err) {
          console.warn("univ notice fetch failed", err);
          setUnivLive(false, "재시도");
          if (!univItems.length) {
            renderUnivNotices([], univUpdatedAt);
          }
          return false;
        }
      }

      if (univRefreshBtn) {
        univRefreshBtn.addEventListener("click", async () => {
          univRefreshBtn.disabled = true;
          setUnivLive(false, "갱신중");
          const ok = await fetchUnivList(true);
          showToast(ok ? "공지 목록을 갱신했습니다" : "갱신에 실패했습니다");
          univRefreshBtn.disabled = false;
        });
      }

      async function bootUnivNotices() {
        setUnivLive(false, UNIV_NOTICE_API_URL ? "연결중" : "미설정");
        renderUnivNotices([], "");
        await fetchUnivList(false);
        if (!UNIV_NOTICE_API_URL) return;
        setInterval(() => fetchUnivList(false), UNIV_POLL_MS);
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") fetchUnivList(false);
        });
      }

      const expandPanel = document.getElementById("expandPanel");
      const expandFrame = document.getElementById("expandFrame");
      const expandTitle = document.getElementById("expandTitle");
      const expandOpen = document.getElementById("expandOpen");
      const expandClose = document.getElementById("expandClose");
      const expandMarkSvg = document.getElementById("expandMarkSvg");
      const expandNavMap = {
        susi: document.getElementById("susiNav"),
        ipgyeol: document.getElementById("ipgyeolNav"),
      };
      let activeExpandKey = null;

      function closeExpand() {
        if (!expandPanel) return;
        expandPanel.classList.remove("is-open");
        Object.values(expandNavMap).forEach((nav) => {
          if (!nav) return;
          nav.classList.remove("is-active");
          nav.setAttribute("aria-expanded", "false");
        });
        activeExpandKey = null;
      }

      function openExpand(key) {
        const app = EXPAND_APPS[key];
        const nav = expandNavMap[key];
        if (!app || !expandPanel || !expandFrame || !nav) return;

        if (activeExpandKey === key && expandPanel.classList.contains("is-open")) {
          closeExpand();
          return;
        }

        Object.values(expandNavMap).forEach((item) => {
          if (!item) return;
          item.classList.remove("is-active");
          item.setAttribute("aria-expanded", "false");
        });

        expandPanel.dataset.theme = app.theme;
        expandTitle.textContent = app.title;
        expandFrame.title = app.title;
        expandOpen.href = app.url;
        if (expandMarkSvg) expandMarkSvg.innerHTML = app.mark;
        if (expandFrame.getAttribute("src") !== app.url) {
          expandFrame.src = app.url;
        }

        expandPanel.classList.add("is-open");
        nav.classList.add("is-active");
        nav.setAttribute("aria-expanded", "true");
        activeExpandKey = key;

        requestAnimationFrame(() => {
          expandPanel.scrollIntoView({ behavior: "smooth", block: "start" });
        });
      }

      Object.entries(expandNavMap).forEach(([key, nav]) => {
        if (!nav) return;
        nav.addEventListener("click", (e) => {
          e.preventDefault();
          openExpand(key);
        });
      });

      if (expandClose) expandClose.addEventListener("click", closeExpand);

      const brandHome = document.querySelector(".nav-brand");
      if (brandHome) {
        brandHome.addEventListener("click", (e) => {
          const host = decodeURIComponent(location.hostname);
          const onSite =
            host === "www.김태훈.com" ||
            host === "김태훈.com" ||
            host.endsWith(".김태훈.com") ||
            location.protocol === "file:";
          if (!onSite) return;
          e.preventDefault();
          closeExpand();
          if (location.hash) history.replaceState(null, "", location.pathname + location.search);
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      }

      if (location.hash === "#susi") openExpand("susi");
      if (location.hash === "#ipgyeol") openExpand("ipgyeol");

      /* ── 방문자 카운터 ── */
      const VISIT_STORE_KEY = "kimtaehoon_visit_v1";
      const visitTodayEl = document.getElementById("visitToday");
      const visitTotalEl = document.getElementById("visitTotal");

      function seoulDateKey(d = new Date()) {
        const parts = new Intl.DateTimeFormat("en-CA", {
          timeZone: "Asia/Seoul",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
        }).formatToParts(d);
        const get = (t) => parts.find((p) => p.type === t)?.value || "00";
        return `${get("year")}-${get("month")}-${get("day")}`;
      }

      function formatVisit(n) {
        return Number(n || 0).toLocaleString("ko-KR");
      }

      function animateVisitNum(el, to) {
        if (!el) return;
        el.classList.remove("is-loading");
        const target = Math.max(0, Math.floor(Number(to) || 0));
        const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (reduce || target <= 0) {
          el.textContent = formatVisit(target);
          return;
        }
        const from = Number(String(el.textContent).replace(/[^\d]/g, "")) || 0;
        const start = from > 0 && from < target ? from : Math.max(0, target - Math.min(target, 28));
        const dur = 640;
        const t0 = performance.now();
        function tick(now) {
          const p = Math.min(1, (now - t0) / dur);
          const eased = 1 - Math.pow(1 - p, 3);
          el.textContent = formatVisit(Math.round(start + (target - start) * eased));
          if (p < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      }

      function readLocalVisits() {
        try {
          const raw = localStorage.getItem(VISIT_STORE_KEY);
          const data = raw ? JSON.parse(raw) : null;
          if (!data || typeof data !== "object") {
            return { total: 0, today: 0, date: "", hit: false };
          }
          return {
            total: Number(data.total) || 0,
            today: Number(data.today) || 0,
            date: String(data.date || ""),
            hit: Boolean(data.hit),
          };
        } catch {
          return { total: 0, today: 0, date: "", hit: false };
        }
      }

      function writeLocalVisits(data) {
        localStorage.setItem(VISIT_STORE_KEY, JSON.stringify(data));
      }

      function syncLocalDay(data) {
        const today = seoulDateKey();
        if (data.date !== today) {
          data.date = today;
          data.today = 0;
          data.hit = false;
        }
        return data;
      }

      function bumpLocalVisits() {
        const data = syncLocalDay(readLocalVisits());
        if (!data.hit) {
          data.hit = true;
          data.today += 1;
          data.total += 1;
          writeLocalVisits(data);
        } else {
          writeLocalVisits(data);
        }
        return data;
      }

      async function fetchVisitJson(url) {
        const res = await fetch(url, { method: "GET", credentials: "omit", cache: "no-store" });
        if (!res.ok) throw new Error("visit_http");
        return res.json();
      }

      async function bootVisits() {
        if (!visitTodayEl || !visitTotalEl) return;

        const local = syncLocalDay(readLocalVisits());
        writeLocalVisits(local);

        if (!VISIT_API_URL) {
          const data = bumpLocalVisits();
          animateVisitNum(visitTodayEl, data.today);
          animateVisitNum(visitTotalEl, data.total);
          return;
        }

        try {
          const shouldHit = !local.hit;
          const action = shouldHit ? "visitHit" : "visitStats";
          const json = await fetchVisitJson(`${VISIT_API_URL}?action=${action}`);
          if (!json || !json.ok) throw new Error("visit_bad");

          if (shouldHit) {
            local.hit = true;
            writeLocalVisits(local);
          }

          animateVisitNum(visitTodayEl, json.today);
          animateVisitNum(visitTotalEl, json.total);
        } catch {
          const data = bumpLocalVisits();
          animateVisitNum(visitTodayEl, data.today);
          animateVisitNum(visitTotalEl, data.total);
        }
      }

      bootUnivNotices();
      bootVisits();
    })();
  </script>
</body>
</html>
